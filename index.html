<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riser Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12222C">
<meta name="description" content="Low voltage and network riser diagram builder. Draw it, schedule it, print it.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Riser Builder">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#12222C;
  --ink-soft:#5A6A73;
  --paper:#F4F5F1;
  --panel:#FFFFFF;
  --rule:#C9D2CD;
  --rule-soft:#E3E8E4;
  --blue:#1B4F72;
  --teal:#0F766E;
  --bronze:#8A5A00;
  --red:#A32B2B;
  --slate:#55606B;
  --mark:#FFD84D;
  --sans:"Archivo Narrow",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:13px;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100vh}

/* ---------- toolbar ---------- */
.bar{
  display:flex;align-items:center;gap:14px;padding:0 12px;height:46px;
  background:var(--ink);color:#EDF0EC;flex:0 0 auto;
}
.brand{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.brand span{color:var(--mark)}
.brand i{font-style:normal;font-size:9px;letter-spacing:.08em;color:rgba(237,240,236,.45);margin-left:6px}
.bar .grow{flex:1}
.bar-title{
  background:transparent;border:0;border-bottom:1px dotted rgba(237,240,236,.45);
  color:#EDF0EC;font-family:var(--mono);font-size:12px;padding:3px 4px;min-width:210px;
}
.bar-title:focus{outline:none;border-bottom-color:var(--mark)}
.btn{
  background:transparent;border:1px solid rgba(237,240,236,.32);color:#EDF0EC;
  padding:5px 10px;border-radius:2px;cursor:pointer;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
.btn:hover{border-color:var(--mark);color:var(--mark)}
.btn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.btn.solid{background:var(--mark);border-color:var(--mark);color:var(--ink);font-weight:600}
.btn.solid:hover{background:#FFE07A;color:var(--ink)}
.bar-find{background:transparent;border:1px solid rgba(237,240,236,.32);color:#EDF0EC;border-radius:2px;
  padding:4px 8px;font-family:var(--mono);font-size:11px;width:110px}
.bar-find:focus{outline:none;border-color:var(--mark)}
.bar-find::placeholder{color:rgba(237,240,236,.45)}
.zoomctl{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px}
.zoomctl button{
  width:22px;height:22px;line-height:1;border:1px solid rgba(237,240,236,.32);
  background:transparent;color:inherit;cursor:pointer;border-radius:2px;
}
.zoomctl button:hover{border-color:var(--mark);color:var(--mark)}

/* ---------- main ---------- */
.main{display:flex;flex:1;min-height:0}
.pal{
  width:186px;flex:0 0 186px;background:var(--panel);border-right:1px solid var(--rule);
  overflow-y:auto;padding-bottom:24px;
}
.pal h3,.insp h3{
  margin:0;padding:10px 12px 6px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;
}
.pal-group{border-bottom:1px solid var(--rule-soft)}
.dev{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border:0;background:none;
  cursor:grab;text-align:left;font-size:12.5px;
}
.dev:hover{background:#F0F3EF}
.dev:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.dev .sw{width:4px;height:16px;border-radius:1px;flex:0 0 4px}
.dev .px{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);margin-left:auto;
  letter-spacing:.04em;
}
.warnpill{
  margin-left:8px;padding:2px 7px;border-radius:9px;border:1px solid #E8CE86;background:#FFF6E0;
  color:#7A5B00;font:inherit;font-size:10.5px;cursor:pointer;
}
.warnpill:hover{border-color:#B8912F}
.bkbar{
  padding:10px 14px;border-bottom:1px solid var(--rule);font-size:12px;line-height:1.5;
  display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;
}
.bkbar.warn{background:#FFF6E0;border-bottom-color:#E8CE86}
.bkbar.ok{background:#F1F6F0}
.bkbar>div:first-child{flex:1;min-width:240px}
.bkbar .btns{display:flex;gap:6px;flex-wrap:wrap}
.bkbar b{font-weight:600}
.pal-head{
  display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);
  border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:3;
}
.pal-head .ttl{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;
}
.pal-tool{
  margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);background:var(--panel);border-radius:2px;cursor:pointer;color:var(--ink-soft);
}
.pal-tool:hover{border-color:var(--ink);color:var(--ink)}
.pal-tool.on{background:var(--ink);border-color:var(--ink);color:var(--mark)}
.pal-note{
  padding:8px 10px;background:#FFFCEC;border-bottom:1px solid var(--rule-soft);
  font-size:11px;line-height:1.45;color:var(--ink-soft);
}
.pal-note .btns{display:flex;gap:6px;margin-top:6px}
.pal.reorder{user-select:none}
.pal.reorder .dev{cursor:grab}
.pal.reorder .pal-group>h3{cursor:grab;display:flex;align-items:center}
.pal.reorder .pal-group{background:#FCFDFB}
.pal.reorder .dev .px{display:none}
.dev .grip,.pal-group>h3 .grip{display:none}
.pal.reorder .dev .grip,.pal.reorder .pal-group>h3 .grip{
  display:inline-flex;margin-left:auto;color:var(--rule);flex:0 0 auto;
}
.pal .dragging{opacity:.45;background:#FFF8DC}
.pal-group.dragging{outline:1px dashed var(--ink-soft)}

/* ---------- canvas ---------- */
.stage{flex:1;position:relative;min-width:0;background:var(--paper);overflow:hidden}
#sheet{width:100%;height:100%;display:block;cursor:default;touch-action:none}
#sheet.panning{cursor:grabbing}
.corner{position:absolute;width:14px;height:14px;border:0 solid var(--rule);pointer-events:none}
.c-tl{top:10px;left:10px;border-top-width:1.5px;border-left-width:1.5px}
.c-tr{top:10px;right:10px;border-top-width:1.5px;border-right-width:1.5px}
.c-bl{bottom:10px;left:10px;border-bottom-width:1.5px;border-left-width:1.5px}
.c-br{bottom:10px;right:10px;border-bottom-width:1.5px;border-right-width:1.5px}
.stamp{
  position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.94);
  border:1px solid var(--ink);padding:7px 10px;pointer-events:auto;cursor:pointer;
  font-family:var(--mono);font-size:10px;line-height:1.5;max-width:280px;
}
.stamp:hover{border-color:var(--blue)}
.stamp b{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block}
.stamp em{font-style:normal;color:var(--ink-soft)}
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;pointer-events:none;color:var(--ink-soft);text-align:center;padding:20px;
}
.empty strong{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.empty code{font-family:var(--mono);font-size:11px;background:#E9EDE8;padding:1px 5px}

/* ---------- inspector ---------- */
.insp{
  width:290px;flex:0 0 290px;background:var(--panel);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;min-height:0;
}
.tabs{display:flex;border-bottom:1px solid var(--rule);flex:0 0 auto}
.tab{
  flex:1;padding:10px 4px;border:0;background:none;cursor:pointer;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark);font-weight:600}
.tabbody{overflow-y:auto;padding:12px;flex:1}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:6px 7px;border:1px solid var(--rule);border-radius:2px;background:#FCFDFB;
  font-family:var(--mono);font-size:12px;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.fld textarea{resize:vertical;min-height:52px;line-height:1.45}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.mini{
  background:#F3F5F1;border:1px solid var(--rule);padding:5px 8px;border-radius:2px;cursor:pointer;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
}
.mini:hover{border-color:var(--ink)}
.mini.danger:hover{border-color:var(--red);color:var(--red)}
.hint{font-size:11.5px;color:var(--ink-soft);line-height:1.5}
.unit{border:1px solid var(--rule);border-left:3px solid var(--blue);border-radius:2px;padding:6px 7px;margin-bottom:6px;background:#FBFCFA}
.unit-h{font-family:var(--mono);font-size:11px;font-weight:600;margin-bottom:5px;letter-spacing:.04em}
.imgprev{width:100%;border:1px solid var(--rule);border-radius:2px;margin-bottom:8px;display:block;max-height:150px;object-fit:cover}
.numrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule-soft)}
.numrow span{flex:1;font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numrow select{width:150px;padding:4px 6px;border:1px solid var(--rule);border-radius:2px;font-size:11px;background:#FCFDFB}
.revrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.revrow span{flex:1;min-width:0}
.revrow b{display:block;font-size:11.5px}
.revrow em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft)}
.revrow .mini{padding:3px 7px;font-size:10px}
.phrow{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.phrow input{margin-top:2px;flex:0 0 auto}
.phrow span{min-width:0}
.phrow b{display:block;font-size:11.5px;font-weight:600}
.phrow em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alignpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.alignpad .mini{padding:6px 3px;font-size:10px}
.doorkit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:4px}
.doorkit .mini{padding:5px 4px;font-size:10px}
.unit-h .xbtn{float:right;border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.unit-h .xbtn:hover{color:var(--red)}
.unit-l{display:block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.unit input{width:100%;padding:4px 6px;margin-bottom:4px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:11px;background:#fff}
.unit input:last-child{margin-bottom:0}
.unit input:focus{outline:none;border-color:var(--blue)}
.tagchip{
  display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;
  border:1px solid currentColor;border-radius:999px;padding:2px 11px;margin-bottom:10px;
}
.lgd{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0}
.lgd i{display:block;width:26px;height:0;border-top-width:2px;border-top-style:solid;flex:0 0 26px}
.tbl{width:100%;border-collapse:collapse;font-size:11px;font-family:var(--mono)}
.tbl th{
  text-align:left;font-family:var(--sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:1px solid var(--ink);padding:4px 5px;font-weight:600;
}
.tbl td{padding:4px 5px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.tbl tr:hover td{background:#F4F6F2;cursor:pointer}
.tbl tr.accrow td{color:var(--ink-soft);font-size:10px}
.tbl tr.accrow td:first-child{text-align:right;padding-right:6px}
.sec{margin:16px 0 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:4px}
.ovl{position:fixed;inset:0;background:rgba(18,34,44,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.ovl.on{display:flex}
.mcard{background:var(--panel);width:640px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;border-radius:3px;box-shadow:0 18px 50px rgba(18,34,44,.35)}
.mhead{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--rule)}
.mhead b{font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.mhead input{flex:1;padding:6px 9px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:12px;background:#FCFDFB}
.mhead input:focus{outline:none;border-color:var(--blue)}
.xbtn{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:20px;line-height:1;padding:0 2px}
.xbtn:hover{color:var(--red)}
.mlist{overflow-y:auto;flex:1;min-height:120px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule-soft)}
.prow:hover{background:#F4F6F2}
.prow.cur{background:#FFFBEC;border-left:3px solid var(--mark);padding-left:11px}
.pname{flex:1;min-width:0;cursor:pointer}
.pname b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname span{font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.pacts{display:flex;gap:4px;flex-shrink:0}
.pacts button{border:1px solid var(--rule);background:#fff;border-radius:2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;cursor:pointer}
.pacts button:hover{border-color:var(--ink)}
.pacts button.danger:hover{border-color:var(--red);color:var(--red)}
.mfoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-soft)}

/* ---------- version button and update panel ---------- */
.verbtn{
  position:relative;background:transparent;border:1px solid rgba(237,240,236,.32);
  color:#EDF0EC;padding:5px 9px;border-radius:2px;cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.04em;white-space:nowrap;
}
.verbtn:hover{border-color:var(--mark);color:var(--mark)}
.verbtn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.verbtn.new{border-color:var(--mark);color:var(--mark)}
.verbtn.new::after{
  content:'';position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;
  background:var(--mark);box-shadow:0 0 0 2px var(--ink);
}
.verbtn.checking{opacity:.6}

.ucard{width:560px}
.ustate{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--rule-soft);font-size:12px;
}
.udot{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.udot.ok{background:var(--teal)}
.udot.new{background:var(--mark);box-shadow:0 0 0 3px rgba(255,216,77,.28)}
.udot.warn{background:var(--bronze)}
.udot.busy{background:var(--blue);animation:upulse 1s ease-in-out infinite}
@keyframes upulse{0%,100%{opacity:.35}50%{opacity:1}}
.ustate .utxt{flex:1;line-height:1.45}
.ustate .utxt small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px}
.ubody{overflow:auto;padding:0 14px 4px}
.urow{
  display:flex;gap:12px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--rule-soft);font-size:11.5px;color:var(--ink-soft);
}
.urow b{color:var(--ink);font-family:var(--mono);font-size:11.5px;font-weight:500}
.urow .grow{flex:1}
.clg{margin:0;padding:0;list-style:none}
.clg li{padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.clg li:last-child{border-bottom:0}
.clg .cver{
  display:flex;align-items:baseline;gap:9px;margin-bottom:5px;
}
.clg .cver b{font-family:var(--mono);font-size:12px}
.clg .cver time{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
.clg .cver .tagnow{
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--ink);color:var(--mark);padding:2px 6px;border-radius:2px;
}
.clg .cver .tagnew{
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--mark);color:var(--ink);padding:2px 6px;border-radius:2px;font-weight:600;
}
.clg ul{margin:0;padding-left:16px}
.clg ul li{padding:1.5px 0;border:0;font-size:12px;line-height:1.5}
.uhelp{
  background:#FBFCF9;border:1px solid var(--rule-soft);border-radius:2px;
  padding:10px 12px;margin:10px 0 4px;font-size:11.5px;line-height:1.6;color:var(--ink-soft);
}
.uhelp code{
  font-family:var(--mono);font-size:11px;background:#EDF0EA;
  padding:1px 4px;border-radius:2px;color:var(--ink);
}
.uhelp b{color:var(--ink)}
.btn-go{
  background:var(--mark);border:1px solid var(--mark);color:var(--ink);font-weight:600;
  padding:7px 14px;border-radius:2px;cursor:pointer;font-size:11.5px;
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
}
.btn-go:hover{background:#FFE07A}
.btn-go:disabled{opacity:.5;cursor:default}
.insp.wide{width:560px;flex:0 0 560px}
.rkwrap{display:flex;gap:16px;align-items:flex-start}
.rkcol{flex:0 0 268px}
.rkside{flex:1;min-width:0}
.rk{position:relative;margin-left:22px;border:1.5px solid var(--ink);background:#FBFCFA;border-radius:2px;touch-action:none}
.rk-u{position:absolute;left:0;right:0;border-top:1px solid var(--rule-soft);pointer-events:none}
.rk-u i{position:absolute;left:-22px;top:1px;font-family:var(--mono);font-size:8px;font-style:normal;color:#9AA3A0;width:18px;text-align:right}
.rk-item{position:absolute;left:2px;right:2px;display:flex;align-items:center;gap:6px;padding:0 5px 0 0;
  border:1px solid;border-radius:2px;cursor:grab;font-family:var(--mono);font-size:10px;overflow:hidden;user-select:none}
.rk-item b{width:4px;align-self:stretch;flex:0 0 4px}
.rk-item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.rk-item em{font-style:normal;font-size:8.5px;color:var(--ink-soft)}
.rk-item.sel{outline:2px solid var(--mark);outline-offset:-1px;z-index:2}
.rk-item.drag{cursor:grabbing;opacity:.9;z-index:3}
.rkparts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rkpart{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--rule);background:#fff;
  border-radius:2px;cursor:grab;font-size:11px;text-align:left}
.rkpart:hover{border-color:var(--ink)}
.rkpart i{width:4px;height:13px;border-radius:1px;flex:0 0 4px}
.rkpart em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink-soft)}
.pgridwrap{display:grid;grid-template-columns:1fr;gap:3px;padding:10px 14px}
#povl .mcard{width:860px}
.prow2 select{
  padding:3px 4px;border:1px solid var(--rule-soft);border-radius:2px;
  font-family:var(--mono);font-size:10.5px;background:#FCFDFB;min-width:0;
}
.prow2 select:focus{outline:none;border-color:var(--blue);background:#fff}
.prow2 .toitem{flex:0 0 210px;width:210px}
.prow2 .toport{flex:0 0 78px;width:78px}
.prow2 .mirror{

<script>
/* =========================================================

  {k:'ispk',  n:'Intercom speaker',  p:'IS',  f:'cam',   g:'speaker'},

  {k:'acp',   n:'Access panel',     p:'ACP', f:'acs',   g:'panel'},

  {k:'custom',n:'Custom device',    p:'X',   f:'other', g:'box'}

const DEVBY = Object.fromEntries(DEV.map(d=>[d.k,d]));

const MEDIA = {
  cat6:   {label:'Cat6',       color:'#1B4F72', dash:'',      w:1.6},
  cat6a:  {label:'Cat6A',      color:'#1B4F72', dash:'',      w:2.2},
  cat5e:  {label:'Cat5e',      color:'#5B7C99', dash:'',      w:1.4},
  smf:    {label:'Fiber SM',   color:'#C08A00', dash:'',      w:2.4},
  mmf:    {label:'Fiber MM',   color:'#C08A00', dash:'7 4',   w:2.4},
  coax:   {label:'Coax RG59',  color:'#55606B', dash:'',      w:1.6},
  s182:   {label:'18/2',       color:'#A32B2B', dash:'5 3',   w:1.5},
  s224:   {label:'22/4',       color:'#A32B2B', dash:'2 3',   w:1.5},
  comp:   {label:'Composite',  color:'#7A3E8A', dash:'',      w:2},
  rf:     {label:'Wireless',   color:'#0F766E', dash:'1 4',   w:1.8},
  sdi:    {label:'SDI coax',   color:'#8E2F63', dash:'',      w:2},
  hdmi:   {label:'HDMI',       color:'#8E2F63', dash:'6 3',   w:2},
  xlr:    {label:'XLR audio',  color:'#5B3E7A', dash:'3 3',   w:1.6},
  pwr:    {label:'Power',      color:'#12222C', dash:'8 3 2 3', w:1.4}
};

const W = 178, H = 54, GRID = 10;
const GW = 300, GH = 190;
const MONO = "'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace";
const SANS = "'Archivo Narrow',Inter,-apple-system,'Segoe UI',sans-serif";

/* =========================================================
   State
   ========================================================= */
const blank = () => ({
  id: uid(),
  meta:{
    project:'', client:'', site:'', drawnBy:'Bridge Cable',
    date: today(), rev:'A', sheet:'Low voltage riser diagram', notes:'',
    version:'1.0', summary:'', coverImg:'', mapImg:'', mapLink:'', mapCaption:''
  },
  nodes:[], links:[], groups:[],
  settings:{ tagStyle:'plain', snap:true, pad:2, cableSheet:false, deliverable:'full', route:'step' },
  view:{x:60,y:60,k:1}
});
let brand = { name:'Bridge Cable', site:'', phone:'', logo:'' };
let S = blank();
let sel = null;
let multi = [];               // node ids when more than one is picked
let findQ = '', findIdx = 0;
function findMatches(){
  const t=findQ.trim().toLowerCase();
  if(!t) return [];
  return S.nodes.filter(n=>[n.tag,n.name,n.model,n.room,n.ip,DEVBY[n.type].n]
    .some(v=>String(v||'').toLowerCase().includes(t)));
}
function findHit(n){
  const t=findQ.trim().toLowerCase();
  if(!t) return true;
  return [n.tag,n.name,n.model,n.room,n.ip,DEVBY[n.type].n]
    .some(v=>String(v||'').toLowerCase().includes(t));
}
function centreOn(n){
  const r=svg.getBoundingClientRect();
  view.x = r.width/2 - (n.x+W/2)*view.k;
  view.y = r.height/2 - (n.y+H/2)*view.k;
  applyView();
}              // {kind:'node'|'link', id}
let view = S.view;
let dirty = false;

function uid(){ return Math.random().toString(36).slice(2,10) }
function today(){
  const d=new Date();
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

/* tag formatting: C01 / C-01 / C(01) */
function fmtTag(prefix, num){
  const n = String(num).padStart(S.settings.pad, '0');
  const st = S.settings.tagStyle;
  if(st==='dash') return prefix+'-'+n;
  if(st==='paren') return prefix+'('+n+')';
  return prefix+n;
}
/* Infrastructure reads as MDF, IDF1, RK2. Field devices read as C01 / C-01 / C(01). */
function tagFor(d, i){
  if(d.f==='infra'){
    const single = (d.k==='mdf' || d.k==='dm');
    return single && i===1 ? d.p : d.p + i;
  }
  return fmtTag(d.p, i);
}
/* Drops and panels belong to a closet, so they restart there. Devices run site wide. */
const DEFAULT_NUMBERING = { drop:'restart', pp:'restart', fe:'restart' };
function numMode(k){
  const set=(S.settings.numbering||{})[k];
  return set || DEFAULT_NUMBERING[k] || 'continuous';
}
/* Restart tags are derived from the drawing, so they follow when a device is re-homed. */
function syncAutoTags(){
  clearLocCache();
  const byType={};
  for(const n of S.nodes){
    if(n.tagLock) continue;
    if(numMode(n.type)!=='restart') continue;
    (byType[n.type]=byType[n.type]||[]).push(n);
  }
  for(const [k,list] of Object.entries(byType)){
    const d=DEVBY[k], groups={};
    for(const n of list){
      const loc=locCode(n)||'';
      (groups[loc]=groups[loc]||[]).push(n);
    }
    for(const [loc,g] of Object.entries(groups)){
      g.sort((a,b)=>(a.y-b.y)||(a.x-b.x));
      let i=1;
      for(const n of g){
        n.tag = (loc? loc+'-' : '') + fmtTag(d.p, i);
        i += qtyOf(n);
      }
    }
  }
}

function nextTagAfter(d, pending){
  const used=new Set([...S.nodes, ...pending].map(n=>n.tag));
  let i=[...S.nodes, ...pending].filter(n=>n.type===d.k).reduce((a,n)=>a+qtyOf(n),0)+1;
  while(used.has(tagFor(d,i))) i++;
  return tagFor(d,i);
}
function nextTag(d){
  const used = new Set(S.nodes.map(n=>n.tag));
  let i = S.nodes.filter(n=>n.type===d.k).reduce((a,n)=>a+qtyOf(n),0) + 1;
  while(used.has(tagFor(d,i))) i++;
  return tagFor(d,i);
}
function qtyOf(n){ return Math.max(1, parseInt(n && n.qty || 1, 10) || 1) }
/* Six cameras means six runs. Change the count and the run follows, unless you typed one. */
function linkQty(l){
  if(l.qtyLock) return Math.max(1, parseInt(l.qty||1,10)||1);
  const a=ent(l.from), b=ent(l.to);
  return Math.max(1, Math.max(a?qtyOf(a):1, b?qtyOf(b):1));
}
/* AP01 with a count of 7 covers AP01 through AP07 */
function tagEnd(n){
  const q=qtyOf(n); if(q<2) return n.tag;
  const m=/^(.*?)(\d+)(\D*)$/.exec(n.tag||'');
  if(!m) return n.tag;
  return m[1] + String(parseInt(m[2],10)+q-1).padStart(m[2].length,'0') + m[3];
}
function tagLabel(n){ return qtyOf(n)>1 ? n.tag+' to '+tagEnd(n) : (n.tag||'') }

/* Each physical device in a counted box gets its own row you can write into. */
function unitTagAt(n,i){
  const m=/^(.*?)(\d+)(\D*)$/.exec(n.tag||'');
  if(!m) return (n.tag||'') + (i? '.'+(i+1) : '');
  return m[1] + String(parseInt(m[2],10)+i).padStart(m[2].length,'0') + m[3];
}
/* M for the MDF, I03 for IDF 3, R02 for a standalone rack. */
function codeOfNode(o){
  if(!o || o.w) return '';
  const num=(/(\d+)/.exec(o.tag||'')||[])[1] || '1';
  if(o.type==='mdf')  return 'M';
  if(o.type==='idf')  return 'I'+String(num).padStart(2,'0');
  if(o.type==='rack') return 'R'+String(num).padStart(2,'0');
  return '';
}
const locCache=new Map();
function clearLocCache(){ locCache.clear(); adjCache=null; entCache=null }
/* Follows the cabling upstream, through switches and boxes, to the closet it lands in. */
function locCode(n){
  if(locCache.has(n.id)) return locCache.get(n.id);
  const v=locCodeRaw(n);
  locCache.set(n.id, v);
  return v;
}
/* Built once per pass. Without it every device rescans every cable. */
let adjCache=null, entCache=null;
function adj(){
  if(adjCache) return adjCache;
  const m=new Map();
  const push=(a,b)=>{ if(!m.has(a)) m.set(a,[]); m.get(a).push(b) };
  for(const l of S.links){ push(l.from,l.to); push(l.to,l.from) }
  adjCache=m; return m;
}
function entFast(id){
  if(!entCache){
    entCache=new Map();
    for(const n of S.nodes) entCache.set(n.id,n);
    for(const g of S.groups) entCache.set(g.id,g);
  }
  return entCache.get(id);
}
function locCodeRaw(n){
  const g=adj(), seen=new Set([n.id]);
  let frontier=[n.id];
  for(let depth=0; depth<7 && frontier.length; depth++){
    const next=[];
    for(const id of frontier){
      for(const other of (g.get(id)||[])){
        if(seen.has(other)) continue;
        seen.add(other);
        const o=entFast(other); if(!o) continue;
        const code=codeOfNode(o);
        if(code) return code;
        next.push(other);
      }
    }
    frontier=next;
  }
  return '';
}
function labelPrefix(n){ return String(n.unitPrefix||'').trim() || locCode(n) }
function autoLabel(n, unitTag){
  const p=labelPrefix(n);
  return p ? p+'-'+unitTag : unitTag;
}
function suggestPrefix(n){ return labelPrefix(n) }
function syncUnits(n){
  const q=qtyOf(n);
  n.units = (n.units||[]).slice(0,q);
  while(n.units.length<q) n.units.push({label:'',model:'',note:''});
  n.units.forEach((u,i)=>{ u.tag=unitTagAt(n,i) });
  return n.units;
}
function accOf(n){ return (n.acc||[]).filter(a=>a && (a.name||a.model)) }
function accQty(a){ return Math.max(1, parseInt(a.qty||1,10)||1) }

/* Cameras and APs list one line each. Data drops stay one line with a count. */
function expandsList(n){ return n.expand===undefined ? n.type!=='drop' : !!n.expand }
function unitRows(n){
  const d=DEVBY[n.type];
  if(qtyOf(n)<2) return [{tag:n.tag, qty:1, label:n.label||autoLabel(n,n.tag), type:d.n,
                          model:n.model||'', note:n.notes||''}];
  if(!expandsList(n)) return [{tag:tagLabel(n), qty:qtyOf(n), label:n.label||locCode(n)||'',
                               type:d.n, model:n.model||'', note:n.notes||''}];
  return syncUnits(n).map(u=>({
    tag:u.tag, qty:1, label:u.label||autoLabel(n,u.tag), type:d.n,
    model:u.model||n.model||'', note:u.note||n.notes||''
  }));
}

const RACKABLE = ['mdf','idf','rack'];
const RU_PRESETS = [
  {k:'pp48',  name:'Patch panel 48', h:2, ports:48, kind:'patch'},
  {k:'pp24',  name:'Patch panel 24', h:1, ports:24, kind:'patch'},
  {k:'fib',   name:'Fiber enclosure',h:1, ports:12, kind:'fiber'},
  {k:'sw48',  name:'Switch 48 port', h:1, ports:48, sfp:4, kind:'switch'},
  {k:'sw24',  name:'Switch 24 port', h:1, ports:24, sfp:2, kind:'switch'},
  {k:'sw8',   name:'Switch 8 port',  h:1, ports:8,  sfp:2, kind:'switch'},
  {k:'gear',  name:'Equipment',      h:1, ports:0,  kind:'gear'},
  {k:'ups',   name:'Battery backup', h:2, ports:0,  kind:'ups'},
  {k:'pdu',   name:'Power strip',    h:1, ports:0,  kind:'pdu'},
  {k:'shelf', name:'Shelf',          h:1, ports:0,  kind:'shelf'},
  {k:'blank', name:'Blank panel',    h:1, ports:0,  kind:'blank'},
  {k:'mgr',   name:'Cable manager',  h:1, ports:0,  kind:'mgr'}
];
const RACK_FILL = {
  patch:'#1B4F72', fiber:'#C08A00', switch:'#0F766E', gear:'#5B3E7A',
  ups:'#55606B', pdu:'#55606B', shelf:'#8A8F8B', blank:'#B8BEB9', mgr:'#8A8F8B'
};
function isRack(n){ return n && RACKABLE.includes(n.type) }
function rackOf(n){
  if(!n.rack) n.rack={ ru:42, items:[] };
  if(!Array.isArray(n.rack.items)) n.rack.items=[];
  return n.rack;
}
function racksInUse(){ return S.nodes.filter(n=>isRack(n) && n.rack && n.rack.items.length) }
function itemPorts(it){ return Math.max(0, parseInt(it.ports||0,10)||0) }
/* Highest free U, counting from the top down. */
function nextFreeU(r, h){
  const taken=new Set();
  r.items.forEach(i=>{ for(let u=i.u; u<i.u+(i.h||1); u++) taken.add(u) });
  for(let top=r.ru; top>=h; top--){
    let ok=true;
    for(let u=top-h+1; u<=top; u++) if(taken.has(u)) ok=false;
    if(ok) return top-h+1;
  }
  return 1;
}
function addRackItem(n, presetKey){
  pushUndo();
  const r=rackOf(n);
  const pre=RU_PRESETS.find(p=>p.k===presetKey)||RU_PRESETS[0];
  const it={ id:uid(), name:pre.name, model:'', ref:'', kind:pre.kind,
             h:pre.h, ports:pre.ports||0, sfp:pre.sfp||0, u:1, assign:[] };
  it.u=nextFreeU(r, it.h);
  r.items.push(it);
  return it;
}

/* =========================================================
   Render
   ========================================================= */
function dims(e){ return {x:e.x, y:e.y, w:e.w||W, h:e.h||H} }
function ent(id){ return S.nodes.find(n=>n.id===id) || S.groups.find(g=>g.id===id) }
function nodeCenter(e){ const d=dims(e); return {x:d.x+d.w/2, y:d.y+d.h/2} }
function childrenOf(g){
  return S.nodes.filter(n=>{
    const c=nodeCenter(n);
    return c.x>=g.x && c.x<=g.x+g.w && c.y>=g.y && c.y<=g.y+g.h;
  });
}
function groupOf(n){
  const c=nodeCenter(n);
  return S.groups.find(g=>c.x>=g.x&&c.x<=g.x+g.w&&c.y>=g.y&&c.y<=g.y+g.h);
}

function sidePoint(e, side, off){
  const d=dims(e); off=off||0;
  const cx=(v,lim)=>Math.max(-(lim/2-16), Math.min(lim/2-16, v));
  switch(side){
    case 'top':    return {x:d.x+d.w/2+cx(off,d.w), y:d.y,       v:true};
    case 'bottom': return {x:d.x+d.w/2+cx(off,d.w), y:d.y+d.h,   v:true};
    case 'left':   return {x:d.x,       y:d.y+d.h/2+cx(off,d.h), v:false};
    default:       return {x:d.x+d.w,   y:d.y+d.h/2+cx(off,d.h), v:false};
  }
}
/* Where on the outside of a box does a loose point belong?  Weigh the sideways
   pull against the up and down pull, each scaled by the box, so the answer holds
   whether the pointer is inside the box or well away from it. */
function anchorFromPoint(e, wx, wy){
  const d=dims(e);
  const dx=wx-(d.x+d.w/2), dy=wy-(d.y+d.h/2);
  if(Math.abs(dx)/Math.max(1,d.w) >= Math.abs(dy)/Math.max(1,d.h))
    return {side: dx>0?'right':'left',  off: Math.round(dy)};
  return   {side: dy>0?'bottom':'top',  off: Math.round(dx)};
}
function autoSides(a,b,route){
  const A=nodeCenter(a), B=nodeCenter(b);
  const dx=B.x-A.x, dy=B.y-A.y, vert=Math.abs(dy)>=Math.abs(dx);
  /* When the second leg would be a stub, meet edge to edge instead. */
  if(route==='hv') return [ dx>0?'right':'left',
    Math.abs(dy) < dims(b).h ? (dx>0?'left':'right') : (dy>0?'top':'bottom') ];
  if(route==='vh') return [ dy>0?'bottom':'top',
    Math.abs(dx) < dims(b).w ? (dy>0?'top':'bottom') : (dx>0?'left':'right') ];
  return vert ? [dy>0?'bottom':'top', dy>0?'top':'bottom']
              : [dx>0?'right':'left', dx>0?'left':'right'];
}
function linkGeom(a,b,off,l){
  off=off||0; l=l||{};
  const route = l.route || S.settings.route || 'step';
  const bend  = parseFloat(l.bend)||0;
  const auto  = autoSides(a,b,route);
  /* An end placed by hand stays where it was put.  An end left on automatic
     still fans out when the pair carries more than one run. */
  const offA = l.fromSide ? (parseFloat(l.fromOff)||0) : off;
  const offB = l.toSide   ? (parseFloat(l.toOff)  ||0) : off;
  const P=sidePoint(a, l.fromSide||auto[0], offA);
  const Q=sidePoint(b, l.toSide  ||auto[1], offB);
  const out = g => (g.p=P, g.q=Q, g);

  if(route==='straight')
    return out({ d:`M${P.x},${P.y} L${Q.x},${Q.y}`, mid:{x:(P.x+Q.x)/2,y:(P.y+Q.y)/2}, axis:'y' });

  if(P.v && Q.v){
    const my=(P.y+Q.y)/2 + bend;
    return out({ d:`M${P.x},${P.y} L${P.x},${my} L${Q.x},${my} L${Q.x},${Q.y}`,
             mid:{x:(P.x+Q.x)/2,y:my}, axis:'y' });
  }
  if(!P.v && !Q.v){
    const mx=(P.x+Q.x)/2 + bend;
    return out({ d:`M${P.x},${P.y} L${mx},${P.y} L${mx},${Q.y} L${Q.x},${Q.y}`,
             mid:{x:mx,y:(P.y+Q.y)/2}, axis:'x' });
  }
  if(P.v)
    return out({ d:`M${P.x},${P.y} L${P.x},${Q.y} L${Q.x},${Q.y}`,
             mid:{x:P.x,y:(P.y+Q.y)/2}, axis:'x' });
  return out({ d:`M${P.x},${P.y} L${Q.x},${P.y} L${Q.x},${Q.y}`,
           mid:{x:(P.x+Q.x)/2,y:P.y}, axis:'y' });
}
/* How far this run sits off centre when a pair carries more than one cable. */
function linkOffsets(){
  const bucket={}, out={};
  for(const l of S.links){
    const k=[l.from,l.to].sort().join('|');
    (bucket[k]=bucket[k]||[]).push(l.id);
  }
  for(const ids of Object.values(bucket))
    ids.forEach((id,i)=>{ out[id] = (i-(ids.length-1)/2)*15 });
  return out;
}

function renderLinks(){
  const offs=linkOffsets();
  let out='', ends='';
  for(const l of S.links){
    const a=ent(l.from), b=ent(l.to); if(!a||!b) continue;
    const m=MEDIA[l.media]||MEDIA.cat6;
    const g=linkGeom(a,b,offs[l.id]||0,l);
    const on = sel && sel.kind==='link' && sel.id===l.id;
    const lq=linkQty(l);
    const lbl = (lq>1? lq+'x ':'') + m.label + (l.label? ' '+l.label : '');
    const tw = lbl.length*5.6+8;
    out += `<g data-link="${l.id}">
      ${on?`<path class="link" d="${g.d}" stroke="#FFD84D" stroke-width="${m.w+5}" stroke-linejoin="round"/>`:''}
      <path class="link" d="${g.d}" stroke="${m.color}" stroke-width="${m.w}" ${m.dash?`stroke-dasharray="${m.dash}"`:''} stroke-linejoin="round"/>
      <path class="link-hit" d="${g.d}"/>
      <rect x="${g.mid.x-tw/2}" y="${g.mid.y-7}" width="${tw}" height="14" fill="#F4F5F1" stroke="${m.color}" stroke-width=".6" rx="1"/>
      <text x="${g.mid.x}" y="${g.mid.y+3.6}" text-anchor="middle" font-family="${MONO}" font-size="9" fill="${m.color}">${esc(lbl)}</text>
    </g>`;
    if(on) ends += `<circle class="lend" data-lend="from" data-lid="${l.id}" cx="${g.p.x}" cy="${g.p.y}" r="5"><title>Drag to move this end. Double click for automatic.</title></circle>

  }
  gLinks.innerHTML = out;
  gEnds.innerHTML = ends;
}

function nodeMarkup(n){

    ${on?`<rect x="-4" y="-4" width="${W+8}" height="${H+8}" rx="4" fill="none" stroke="#FFD84D" stroke-width="4"/>`:''}

    <path d="M3,0 h4 v${H} h-4 a3,3 0 0 1 -3,-3 v-${H-6} a3,3 0 0 1 3,-3 z" fill="${c}"/>
    ${hasTag?`<ellipse cx="34" cy="${H/2}" rx="19" ry="14" fill="${c}14" stroke="${c}" stroke-width="1.2"/>
    <text x="34" y="${H/2+3.8}" text-anchor="middle" font-family="${MONO}" font-weight="600" font-size="${tagSize}" fill="${c}">${esc(tag)}</text>`:''}
    <g transform="translate(${W-26},${q>1?5:H/2-10})">${glyph(d.g,c)}</g>
    ${badge}
    <text x="${textX}" y="${(sub||q>1)? H/2-2 : H/2+4}" font-family="${SANS}" font-size="12" font-weight="600" fill="#12222C">${esc(clip(name,hasTag?(q>1?14:17):24))}</text>
    ${q>1 ? rangeTxt : (sub?`<text x="${textX}" y="${H/2+12}" font-family="${MONO}" font-size="8.5" fill="#5A6A73">${esc(clip(sub,hasTag?22:30))}</text>`:'')}
    <circle class="anchor" data-anchor="1" cx="${W/2}" cy="0" r="4.5"/>

    <circle class="anchor" data-anchor="1" cx="0" cy="${H/2}" r="4.5"/>
    <circle class="anchor" data-anchor="1" cx="${W}" cy="${H/2}" r="4.5"/>

}
function clip(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+'\u2026' : s }

function renderNodes(){ gNodes.innerHTML = S.nodes.map(nodeMarkup).join('') }

function groupMarkup(g){

/* =========================================================
   Palette
   ========================================================= */
/* =========================================================
   Device library, and the order it sits in
   ========================================================= */
const PALKEY='topo:palorder';
const PALBOX='__boxes';
const PALBOXES=[
  {k:'grp:Door', n:'Door box', p:'DOOR', g:'Door', c:()=>FAM.acs.color},
  {k:'grp:Area', n:'Area box', p:'AREA', g:'Area', c:()=>FAM.net.color}
];
const GRIP='<svg class="grip" width="10" height="14" viewBox="0 0 10 14" aria-hidden="true" fill="currentColor">'
  + [3,7,11].map(y=>`<circle cx="2.6" cy="${y}" r="1.15"/><circle cx="7.4" cy="${y}" r="1.15"/>`).join('')
  + '</svg>';
const PALTOOL='<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" '
  + 'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M4.5 13.5v-11M2.5 4.5 4.5 2.5 6.5 4.5"/>'
  + '<path d="M11.5 2.5v11M9.5 11.5l2 2 2-2"/></svg>';

let palOrder=null, palEdit=false;

const palLabel = k => k===PALBOX ? 'Boxes' : ((FAM[k]||{}).label || k);

function defaultPalOrder(){
  const fams=[...Object.keys(FAM), PALBOX], devs={};
  for(const k of Object.keys(FAM)) devs[k]=DEV.filter(d=>d.f===k).map(d=>d.k);
  devs[PALBOX]=PALBOXES.map(b=>b.k);
  return {fams,devs};
}
/* Keep a saved order usable when the catalog grows: drop what no longer exists,
   append anything new at the end of its section. */
function palNormalise(o){
  const def=defaultPalOrder();
  if(!o || typeof o!=='object') return def;
  const fams=[...new Set((o.fams||[]).filter(k=>def.fams.includes(k)))];
  for(const k of def.fams) if(!fams.includes(k)) fams.push(k);
  const devs={};
  for(const f of fams){
    const want=def.devs[f]||[];
    const keep=[...new Set(((o.devs&&o.devs[f])||[]).filter(k=>want.includes(k)))];
    for(const k of want) if(!keep.includes(k)) keep.push(k);
    devs[f]=keep;
  }
  return {fams,devs};
}

function renderPalette(){
  const pal=document.getElementById('pal'); if(!pal) return;
  const ord = palOrder = palNormalise(palOrder);
  pal.classList.toggle('reorder', palEdit);
  let html=`<div class="pal-head"><span class="ttl">Devices</span>
    <button class="pal-tool ${palEdit?'on':''}" id="palTool" type="button"
      aria-pressed="${palEdit?'true':'false'}"
      title="${palEdit?'Finish reordering':'Reorder the list'}">${PALTOOL}</button></div>`;
  if(palEdit) html+=`<div class="pal-note">Drag a row to move it inside its section.
    Drag a section heading to move the whole section.
    <div class="btns"><button class="mini" id="palDone" type="button">Done</button>
    <button class="mini" id="palReset" type="button">Reset order</button></div></div>`;
  for(const fk of ord.fams){
    html += `<div class="pal-group" data-fam="${fk}"><h3>${esc(palLabel(fk))}${GRIP}</h3>`;
    for(const k of (ord.devs[fk]||[])){
      if(fk===PALBOX){
        const b=PALBOXES.find(x=>x.k===k); if(!b) continue;
        html += `<button class="dev" type="button" data-k="${b.k}" data-addgroup="${b.g}" draggable="${palEdit?'false':'true'}">
          <span class="sw" style="background:${b.c()}"></span>${esc(b.n)}<span class="px">${b.p}</span>${GRIP}</button>`;
      }else{
        const d=DEVBY[k]; if(!d) continue;
        html += `<button class="dev" type="button" data-k="${d.k}" data-add="${d.k}" draggable="${palEdit?'false':'true'}">
          <span class="sw" style="background:${FAM[fk].color}"></span>${esc(d.n)}<span class="px">${d.p}</span>${GRIP}</button>`;
      }
    }
    html += `</div>`;
  }
  pal.innerHTML=html;
}

/* Read the order back off the DOM after a drag. */
function palCommit(){
  const pal=document.getElementById('pal');
  const groups=[...pal.querySelectorAll('.pal-group')];
  const fams=groups.map(g=>g.dataset.fam), devs={};
  for(const g of groups) devs[g.dataset.fam]=[...g.querySelectorAll('.dev')].map(b=>b.dataset.k);
  palOrder={fams,devs};
  savePalOrder();
}
async function savePalOrder(){
  try{ await store.set(PALKEY, JSON.stringify(palOrder)) }catch{}
}
async function loadPalOrder(){
  try{ palOrder=palNormalise(JSON.parse((await store.get(PALKEY)).value)) }
  catch{ palOrder=defaultPalOrder() }
  renderPalette();
}

(function paletteWiring(){
  const pal=document.getElementById('pal');
  renderPalette();

  pal.addEventListener('click',e=>{
    if(e.target.closest('#palTool')){ palEdit=!palEdit; renderPalette(); return }
    if(e.target.closest('#palDone')){ palEdit=false; renderPalette(); return }
    if(e.target.closest('#palReset')){
      palOrder=defaultPalOrder(); savePalOrder(); renderPalette();
      toast('Device list back to its original order.'); return;
    }
    if(palEdit) return;                       /* reordering, not placing */
    const g=e.target.closest('[data-addgroup]');
    const r=stage.getBoundingClientRect();
    const c=toWorld(r.left+r.width/2, r.top+r.height/2);
    if(g){ addGroup(g.dataset.addgroup, c.x-GW/2, c.y-GH/2); return }
    const b=e.target.closest('[data-add]'); if(!b) return;
    addNode(b.dataset.add, c.x-W/2 + (S.nodes.length%3)*24, c.y-H/2 + (S.nodes.length%5)*18);
  });

  pal.addEventListener('dragstart',e=>{
    if(palEdit){ e.preventDefault(); return }
    const g=e.target.closest('[data-addgroup]');
    if(g){ e.dataTransfer.setData('text/plain','group:'+g.dataset.addgroup); return }
    const b=e.target.closest('[data-add]'); if(!b) return;
    e.dataTransfer.setData('text/plain', b.dataset.add);
  });

  /* ---- reorder drag, rows inside a section and whole sections ---- */
  let pd=null;
  pal.addEventListener('pointerdown',e=>{
    if(!palEdit || e.button!==0) return;
    const head=e.target.closest('.pal-group>h3');
    const row=head ? null : e.target.closest('.dev');
    const el = head ? head.parentElement : row;
    if(!el) return;
    e.preventDefault();
    pd={el, kind: head ? 'fam' : 'dev'};
    el.classList.add('dragging');
    if(pal.setPointerCapture) pal.setPointerCapture(e.pointerId);
  });
  pal.addEventListener('pointermove',e=>{
    if(!pd) return;
    e.preventDefault();
    const t=document.elementFromPoint(e.clientX,e.clientY); if(!t) return;
    const over = pd.kind==='dev' ? t.closest('.dev') : t.closest('.pal-group');
    if(!over || over===pd.el) return;
    if(pd.kind==='dev' && over.parentElement!==pd.el.parentElement) return;
    const r=over.getBoundingClientRect();
    over.parentElement.insertBefore(pd.el, e.clientY > r.top+r.height/2 ? over.nextSibling : over);
  });
  const endReorder=()=>{
    if(!pd) return;
    pd.el.classList.remove('dragging'); pd=null;
    palCommit();
  };
  pal.addEventListener('pointerup',endReorder);
  pal.addEventListener('pointercancel',endReorder);

  stage.addEventListener('dragover',e=>e.preventDefault());
  stage.addEventListener('drop',e=>{
    e.preventDefault();
    const k=e.dataTransfer.getData('text/plain');
    const c=toWorld(e.clientX,e.clientY);
    if(k.startsWith('group:')){ addGroup(k.slice(6), c.x-GW/2, c.y-GH/2); return }
    if(!DEVBY[k]) return;
    addNode(k, c.x-W/2, c.y-H/2);
  });
})();

function snap(v){ return S.settings.snap ? Math.round(v/GRID)*GRID : Math.round(v) }

function addNode(k,x,y){
  pushUndo();
  const d=DEVBY[k];
  const blankTypes=['door','custom'];
  const n={ id:uid(), type:k, tag: k==='custom'? '' : nextTag(d),
            name: blankTypes.includes(k)? '' : d.n, qty:1, label:'', unitPrefix:'', units:[],
            room:'', model:'', ip:'', ports:'', notes:'', x:snap(x), y:snap(y) };
  S.nodes.push(n); sel={kind:'node',id:n.id}; touch(); render(); showTab('device');
  return n;
}
function addGroup(kind, x, y){
  pushUndo();
  const same=S.groups.filter(g=>(g.label||'').startsWith(kind)).length;
  const g={ id:uid(), label:kind+' '+(same+1), notes:'',
            color: kind==='Door'? FAM.acs.color : FAM.net.color,
            x:snap(x), y:snap(y), w:GW, h:GH };
  S.groups.push(g); sel={kind:'group',id:g.id}; touch(); render(); showTab('device');
  return g;
}
function fitGroup(g){
  const kids=childrenOf(g); if(!kids.length) return;
  const pad=26;
  const x=Math.min(...kids.map(n=>n.x))-pad, y=Math.min(...kids.map(n=>n.y))-pad;
  g.w=Math.max(160, Math.max(...kids.map(n=>n.x+W))+pad-x);
  g.h=Math.max(90,  Math.max(...kids.map(n=>n.y+H))+pad-y);
  g.x=snap(x); g.y=snap(y);
}

function delSel(){
  if(!sel) return;
  pushUndo();
  if(sel.kind==='group'){
    S.groups=S.groups.filter(g=>g.id!==sel.id);
    S.links=S.links.filter(l=>l.from!==sel.id&&l.to!==sel.id);
    sel=null; touch(); render(); return;
  }
  if(sel.kind==='node'){
    S.nodes=S.nodes.filter(n=>n.id!==sel.id);
    S.links=S.links.filter(l=>l.from!==sel.id&&l.to!==sel.id);
    S.nodes.forEach(n=>{ if(n.rack) n.rack.items.forEach(it=>{ if(it.ref===sel.id) it.ref='' }) });
  } else {
    S.links=S.links.filter(l=>l.id!==sel.id);
  }
  sel=null; touch(); render();
}
function dupSel(){
  if(!sel||sel.kind!=='node') return;
  pushUndo();
  const s=S.nodes.find(n=>n.id===sel.id); if(!s) return;
  const d=DEVBY[s.type];
  const n={...s, id:uid(), tag:nextTag(d), x:s.x+24, y:s.y+24};
  S.nodes.push(n); sel={kind:'node',id:n.id}; touch(); render();
}
/* ---- clipboard, works across projects ---- */
let clipMem=null;
const CLIPKEY='topo:clip';
function copySelection(){
  const ids = multi.length ? multi : (sel && sel.kind==='node' ? [sel.id] : []);
  if(!ids.length){ toast('Nothing selected to copy'); return }
  const set=new Set(ids);
  const payload={
    nodes:S.nodes.filter(n=>set.has(n.id)).map(n=>JSON.parse(JSON.stringify(n))),
    links:S.links.filter(l=>set.has(l.from)&&set.has(l.to)).map(l=>JSON.parse(JSON.stringify(l)))
  };
  clipMem=payload;
  store.set(CLIPKEY, JSON.stringify(payload)).catch(()=>{});
  toast(payload.nodes.length+' copied');
}
async function pasteClip(){
  let payload=clipMem;
  if(!payload){
    try{ payload=JSON.parse((await store.get(CLIPKEY)).value) }catch{ }
  }
  if(!payload || !payload.nodes || !payload.nodes.length){ toast('Clipboard is empty'); return }
  pushUndo();
  const r=svg.getBoundingClientRect();
  const c=toWorld(r.left+r.width/2, r.top+r.height/2);
  const minX=Math.min(...payload.nodes.map(n=>n.x)), minY=Math.min(...payload.nodes.map(n=>n.y));
  const map={}, made=[];
  for(const src of payload.nodes){
    const n=JSON.parse(JSON.stringify(src));
    const d=DEVBY[n.type]||DEV[0];
    n.id=uid();
    n.x=snap(c.x + (src.x-minX) - W/2);
    n.y=snap(c.y + (src.y-minY) - H/2);
    if(numMode(n.type)!=='restart' && !n.tagLock) n.tag=nextTagAfter(d, made);
    map[src.id]=n.id; made.push(n);
  }
  S.nodes.push(...made);
  for(const l of (payload.links||[])){
    if(!map[l.from]||!map[l.to]) continue;
    S.links.push({...JSON.parse(JSON.stringify(l)), id:uid(), from:map[l.from], to:map[l.to]});
  }
  multi=made.map(n=>n.id); sel={kind:'node', id:multi[0]};
  touch(); render(); showTab('device');
  toast(made.length+' pasted');
}

/* ---- undo ---- */
const undoStack=[], redoStack=[];
function snapshot(){ S.view=view; return JSON.stringify(S) }
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length>30) undoStack.shift();
  redoStack.length=0;
}
function restore(json){
  const obj=JSON.parse(json);
  S=obj;
  view=Object.assign({x:60,y:60,k:1}, obj.view||{});
  sel=null; rackCtx.itemId=null;
  const pn=document.getElementById('projName'); if(pn) pn.value=S.meta.project||'';
  clearLocCache(); dirty=true; render(); showSaveState();
}
function undo(){
  if(!undoStack.length){ toast('Nothing to undo'); return }
  redoStack.push(snapshot());
  restore(undoStack.pop());
  toast('Undone');
}
function redo(){
  if(!redoStack.length){ toast('Nothing to redo'); return }
  undoStack.push(snapshot());
  restore(redoStack.pop());
  toast('Redone');
}

function touch(){ dirty=true; clearLocCache(); if(typeof showSaveState==='function') showSaveState() }

/* =========================================================
   Canvas interaction: move, link, pan, zoom
   ========================================================= */
let drag=null;

svg.addEventListener('pointerdown', e=>{
  const anchor=e.target.closest('[data-anchor]');
  const sizeEl=e.target.closest('[data-gsize]');
  const nodeEl=e.target.closest('[data-node]');
  const grpEl =e.target.closest('[data-group]');
  const linkEl=e.target.closest('[data-link]');
  const endEl =e.target.closest('[data-lend]');

  if(endEl){
    e.preventDefault();
    const l=S.links.find(x=>x.id===endEl.dataset.lid); if(!l) return;
    drag={mode:'lend', id:l.id, end:endEl.dataset.lend, moved:false};
    if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    return;
  }
  if(sizeEl && grpEl){
    e.preventDefault();
    const g=S.groups.find(x=>x.id===grpEl.dataset.group); if(!g) return;
    const w0=toWorld(e.clientX,e.clientY);
    drag={mode:'resize', id:g.id, sx:w0.x, sy:w0.y, w:g.w, h:g.h};
    sel={kind:'group',id:g.id}; render(); showTab('device');
    if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    return;
  }
  if(anchor && (nodeEl||grpEl)){
    e.preventDefault();
    drag={mode:'link', from: nodeEl ? nodeEl.dataset.node : grpEl.dataset.group};
    if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    return;
  }
  if(nodeEl){
    e.preventDefault();
    const n=S.nodes.find(x=>x.id===nodeEl.dataset.node); if(!n) return;
    const w=toWorld(e.clientX,e.clientY);
    if(e.shiftKey){
      multi = multi.includes(n.id) ? multi.filter(id=>id!==n.id) : [...multi, n.id];
      if(!multi.includes(n.id) && multi.length) sel={kind:'node',id:multi[0]};
      else sel={kind:'node',id:n.id};
      render(); showTab('device');
      return;
    }
    if(!multi.includes(n.id)) multi=[n.id];
    const movers = multi.length>1 ? multi : [n.id];
    drag={mode:'move', id:n.id, moved:false,
          set: movers.map(id=>{const m=S.nodes.find(x=>x.id===id); return {id, dx:w.x-m.x, dy:w.y-m.y}})};
    sel={kind:'node',id:n.id}; render(); showTab('device');
    if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    return;
  }
  if(grpEl){
    e.preventDefault();
    const g=S.groups.find(x=>x.id===grpEl.dataset.group); if(!g) return;
    const w=toWorld(e.clientX,e.clientY);
    const kids=childrenOf(g).map(n=>({id:n.id, ox:n.x-g.x, oy:n.y-g.y}));
    drag={mode:'gmove', id:g.id, dx:w.x-g.x, dy:w.y-g.y, kids, moved:false};
    sel={kind:'group',id:g.id}; render(); showTab('device');
    if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    return;
  }
  if(linkEl){
    e.preventDefault();
    const l=S.links.find(x=>x.id===linkEl.dataset.link);
    sel={kind:'link',id:linkEl.dataset.link};
    render(); showTab('device');
    if(l){
      const a=ent(l.from), b=ent(l.to);
      const route=l.route||S.settings.route||'step';
      if(a&&b&&route!=='straight'){
        const g=linkGeom(a,b,0,l);
        const w=toWorld(e.clientX,e.clientY);
        drag={mode:'bend', id:l.id, axis:g.axis, sx:w.x, sy:w.y, base:parseFloat(l.bend)||0, moved:false};
        if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
      }
    }
    return;
  }
  if(e.shiftKey){
    const w=toWorld(e.clientX,e.clientY);
    drag={mode:'marquee', x0:w.x, y0:w.y, moved:false};
    if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    return;
  }
  // empty canvas: pan
  drag={mode:'pan', sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, moved:false};
  svg.classList.add('panning');
  if(svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(drag.mode==='move'){
    const w=toWorld(e.clientX,e.clientY);
    for(const m of drag.set){
      const n=S.nodes.find(x=>x.id===m.id); if(!n) continue;
      n.x=snap(w.x-m.dx); n.y=snap(w.y-m.dy);
      const g=gNodes.querySelector(`[data-node="${n.id}"]`);
      if(g) g.setAttribute('transform',`translate(${n.x},${n.y})`);
    }
    drag.moved=true;
    renderLinks();
  } else if(drag.mode==='gmove'){
    const g=S.groups.find(x=>x.id===drag.id); if(!g) return;
    const w=toWorld(e.clientX,e.clientY);
    g.x=snap(w.x-drag.dx); g.y=snap(w.y-drag.dy);
    for(const k of drag.kids){
      const n=S.nodes.find(x=>x.id===k.id); if(n){ n.x=g.x+k.ox; n.y=g.y+k.oy }
    }
    drag.moved=true; renderGroups(); renderNodes(); renderLinks();
  } else if(drag.mode==='resize'){
    const g=S.groups.find(x=>x.id===drag.id); if(!g) return;
    const w=toWorld(e.clientX,e.clientY);
    g.w=Math.max(150, snap(drag.w + (w.x-drag.sx)));
    g.h=Math.max(90,  snap(drag.h + (w.y-drag.sy)));
    drag.moved=true; renderGroups(); renderLinks();
  } else if(drag.mode==='marquee'){
    const w=toWorld(e.clientX,e.clientY);
    drag.x1=w.x; drag.y1=w.y; drag.moved=true;
    const x=Math.min(drag.x0,w.x), y=Math.min(drag.y0,w.y);
    gTemp.innerHTML=`<rect x="${x}" y="${y}" width="${Math.abs(w.x-drag.x0)}" height="${Math.abs(w.y-drag.y0)}"
      fill="#FFD84D22" stroke="#12222C" stroke-width="1" stroke-dasharray="4 3"/>`;
  } else if(drag.mode==='bend'){
    const l=S.links.find(x=>x.id===drag.id); if(!l) return;
    const w=toWorld(e.clientX,e.clientY);
    const d = drag.axis==='x' ? (w.x-drag.sx) : (w.y-drag.sy);
    if(Math.abs(d)>2) drag.moved=true;
    l.bend = snap(drag.base + d);
    renderLinks();
  } else if(drag.mode==='lend'){
    const l=S.links.find(x=>x.id===drag.id); if(!l) return;
    const t=ent(drag.end==='from' ? l.from : l.to); if(!t) return;
    const w=toWorld(e.clientX,e.clientY);
    const a=anchorFromPoint(t, w.x, w.y);
    if(!drag.moved) pushUndo();
    if(drag.end==='from'){ l.fromSide=a.side; l.fromOff=a.off }
    else                 { l.toSide  =a.side; l.toOff  =a.off }
    drag.moved=true; renderLinks();
  } else if(drag.mode==='pan'){
    view.x=drag.vx+(e.clientX-drag.sx); view.y=drag.vy+(e.clientY-drag.sy);
    drag.moved=true; applyView();
  } else if(drag.mode==='link'){
    const a=S.nodes.find(x=>x.id===drag.from); if(!a) return;
    const A=nodeCenter(a), w=toWorld(e.clientX,e.clientY);
    gTemp.innerHTML=`<path d="M${A.x},${A.y} L${w.x},${w.y}" stroke="#1B4F72" stroke-width="1.6"
       stroke-dasharray="5 4" fill="none"/><circle cx="${w.x}" cy="${w.y}" r="4" fill="#1B4F72"/>`;
  }
});

svg.addEventListener('pointerup', e=>{
  if(!drag){ return }
  if(drag.mode==='link'){
    gTemp.innerHTML='';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const hitNode=el && el.closest && el.closest('[data-node]');
    const hitGrp =el && el.closest && el.closest('[data-group]');
    let to = hitNode ? hitNode.dataset.node : hitGrp ? hitGrp.dataset.group : null;
    if(!to){                                   // dropped inside a box, not on its border
      const w=toWorld(e.clientX,e.clientY);
      const g=S.groups.find(g=>w.x>=g.x&&w.x<=g.x+g.w&&w.y>=g.y&&w.y<=g.y+g.h);
      if(g) to=g.id;
    }
    if(to && to!==drag.from){
      pushUndo();
      const l={id:uid(), from:drag.from, to,
               media:guessMedia(drag.from,to),
               qty:1, label:''};
      S.links.push(l); sel={kind:'link',id:l.id}; touch();
    }
    render(); showTab('device');
  }
  if((drag.mode==='move'||drag.mode==='gmove'||drag.mode==='resize'||drag.mode==='bend'||drag.mode==='lend') && drag.moved) touch();
  if((drag.mode==='bend'||drag.mode==='lend') && drag.moved) renderInspector();
  if(drag.mode==='marquee'){
    gTemp.innerHTML='';
    if(drag.moved){
      const x0=Math.min(drag.x0,drag.x1), x1=Math.max(drag.x0,drag.x1);
      const y0=Math.min(drag.y0,drag.y1), y1=Math.max(drag.y0,drag.y1);
      multi=S.nodes.filter(n=>n.x+W>x0 && n.x<x1 && n.y+H>y0 && n.y<y1).map(n=>n.id);
      sel = multi.length ? {kind:'node', id:multi[0]} : null;
      showTab('device');
    }
    render();
  }
  if(drag.mode==='pan' && !drag.moved){ sel=null; multi=[]; render() }
  svg.classList.remove('panning');
  drag=null;
});

function guessMedia(aId,bId){
  const a=S.nodes.find(n=>n.id===aId), b=S.nodes.find(n=>n.id===bId);
  const t=[a&&a.type, b&&b.type];
  const has=(...k)=>k.some(x=>t.includes(x));
  if(has('mdf','idf') && t.includes('mdf') && t.includes('idf')) return 'smf';
  if(has('fe')) return 'smf';
  if(has('rdr','push')) return 's224';
  if(has('mic')) return 'xlr';
  if(has('prj','ctl')) return 'hdmi';
  if(has('enc','vsw','cvt')) return 'sdi';
  if(has('mix')) return 'xlr';
  if(has('spk','ispk')) return 's182';
  if(has('strike','sir','ps')) return 's182';
  if(has('door')) return 's224';
  if(has('dc','gb','md','kp')) return 's224';
  if(has('wb')) return 'rf';
  return 'cat6';
}

svg.addEventListener('dblclick', e=>{
  /* The drag captures the pointer on the sheet, which retargets the clicks that
     make up a double click, so ask what is actually under the cursor instead. */
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const endEl=(under&&under.closest&&under.closest('[data-lend]')) || e.target.closest('[data-lend]');
  if(endEl){
    const l=S.links.find(x=>x.id===endEl.dataset.lid); if(!l) return;
    pushUndo();
    if(endEl.dataset.lend==='from'){ l.fromSide=''; l.fromOff=0 }
    else                           { l.toSide  =''; l.toOff  =0 }
    touch(); renderLinks(); renderInspector();
    toast('That end is back on automatic.');
    return;
  }
  const nodeEl=e.target.closest('[data-node]'), grpEl=e.target.closest('[data-group]');
  if(nodeEl) sel={kind:'node', id:nodeEl.dataset.node};
  else if(grpEl) sel={kind:'group', id:grpEl.dataset.group};
  else return;
  showTab('device'); render();
  const f=document.querySelector('[data-n="name"], [data-g="label"]');
  if(f){ f.focus(); f.select() }
});

svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const k=Math.min(2.5, Math.max(.25, view.k * (e.deltaY<0?1.12:1/1.12)));
  view.x = mx - (mx-view.x)*(k/view.k);
  view.y = my - (my-view.y)*(k/view.k);
  view.k = k; applyView();
},{passive:false});

function zoomBy(f){
  const r=svg.getBoundingClientRect(), mx=r.width/2, my=r.height/2;
  const k=Math.min(2.5,Math.max(.25,view.k*f));
  view.x=mx-(mx-view.x)*(k/view.k); view.y=my-(my-view.y)*(k/view.k); view.k=k; applyView();
}
function bbox(pad=40){
  const items=[...S.nodes.map(n=>({x:n.x,y:n.y,w:W,h:H})),
               ...S.groups.map(g=>({x:g.x,y:g.y-22,w:g.w,h:g.h+22}))];
  if(!items.length) return {x:0,y:0,w:800,h:600};
  const x=Math.min(...items.map(i=>i.x))-pad, y=Math.min(...items.map(i=>i.y))-pad;
  const w=Math.max(...items.map(i=>i.x+i.w))+pad-x, h=Math.max(...items.map(i=>i.y+i.h))+pad-y;
  return {x,y,w,h};
}
function fit(){
  const b=bbox(60), r=svg.getBoundingClientRect();
  const k=Math.min(2, Math.max(.25, Math.min(r.width/b.w, r.height/b.h)));
  view.k=k; view.x=(r.width-b.w*k)/2-b.x*k; view.y=(r.height-b.h*k)/2-b.y*k; applyView();
}

document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(e.key==='Delete'||e.key==='Backspace'){
    e.preventDefault();
    if(multi.length>1){ const b=document.querySelector('#mdel'); if(b) b.click(); else delSel() }
    else delSel();
  }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='c'){ e.preventDefault(); copySelection() }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='v'){ e.preventDefault(); pasteClip() }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){
    e.preventDefault(); const fb=document.getElementById('findBox'); fb.focus(); fb.select();
  }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupSel() }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveProject() }
  else if(e.key==='Escape'){
    if(povl.classList.contains('on')) closePorts();
    else if(ovl.classList.contains('on')) closeLibrary();
    else { sel=null; multi=[]; render() }
  }
  else if(e.key.startsWith('Arrow') && sel && (sel.kind==='node'||sel.kind==='group')){
    e.preventDefault();
    const step=e.shiftKey?1:GRID;
    const dx=(e.key==='ArrowRight'?step:0)-(e.key==='ArrowLeft'?step:0);
    const dy=(e.key==='ArrowDown'?step:0)-(e.key==='ArrowUp'?step:0);
    if(sel.kind==='node'){
      const n=S.nodes.find(x=>x.id===sel.id); if(!n) return;
      n.x+=dx; n.y+=dy;
    } else {
      const g=S.groups.find(x=>x.id===sel.id); if(!g) return;
      const kids=childrenOf(g);
      g.x+=dx; g.y+=dy; kids.forEach(n=>{ n.x+=dx; n.y+=dy });
    }
    touch(); render();
  }
});

/* =========================================================
   Auto arrange (tier layout)
   ========================================================= */
function autoArrange(){
  if(!S.nodes.length) return;
  pushUndo();
  const kids=new Map(), indeg=new Map();
  S.nodes.forEach(n=>{kids.set(n.id,[]); indeg.set(n.id,0)});
  S.links.forEach(l=>{
    if(kids.has(l.from)&&kids.has(l.to)){ kids.get(l.from).push(l.to); indeg.set(l.to,indeg.get(l.to)+1) }
  });
  const rank=new Map();
  const roots=S.nodes.filter(n=>indeg.get(n.id)===0).map(n=>n.id);
  const q=[...(roots.length?roots:[S.nodes[0].id])];
  q.forEach(id=>rank.set(id,0));
  while(q.length){
    const id=q.shift();
    for(const c of kids.get(id)||[]){
      if(!rank.has(c)){ rank.set(c, rank.get(id)+1); q.push(c) }
    }
  }
  S.nodes.forEach(n=>{ if(!rank.has(n.id)) rank.set(n.id, 0) });
  const tiers={};
  S.nodes.forEach(n=>{
    if(groupOf(n)) return;                 // leave boxed devices where you put them
    const r=rank.get(n.id); (tiers[r]=tiers[r]||[]).push(n);
  });
  Object.keys(tiers).forEach(r=>{
    const row=tiers[r]; const gapX=W+52, total=row.length*gapX-52;
    row.sort((a,b)=>a.x-b.x);
    row.forEach((n,i)=>{ n.x=snap(-total/2 + i*gapX + 400); n.y=snap(80 + Number(r)*(H+72)) });
  });
  touch(); render(); fit(); toast('Arranged by tier. Devices inside a box were left alone.');
}

function alignMulti(mode){
  const ns=S.nodes.filter(n=>multi.includes(n.id));
  if(ns.length<2) return;
  pushUndo();
  const xs=ns.map(n=>n.x), ys=ns.map(n=>n.y);
  if(mode==='left'){ const v=Math.min(...xs); ns.forEach(n=>n.x=v) }
  if(mode==='right'){ const v=Math.max(...xs.map((x,i)=>x+W)); ns.forEach(n=>n.x=v-W) }
  if(mode==='cx'){ const v=(Math.min(...xs)+Math.max(...xs))/2; ns.forEach(n=>n.x=snap(v)) }
  if(mode==='top'){ const v=Math.min(...ys); ns.forEach(n=>n.y=v) }
  if(mode==='bottom'){ const v=Math.max(...ys.map(y=>y+H)); ns.forEach(n=>n.y=v-H) }
  if(mode==='cy'){ const v=(Math.min(...ys)+Math.max(...ys))/2; ns.forEach(n=>n.y=snap(v)) }
  if(mode==='dh'){
    ns.sort((a,b)=>a.x-b.x);
    const first=ns[0].x, last=ns[ns.length-1].x, step=(last-first)/(ns.length-1);
    ns.forEach((n,i)=>n.x=snap(first+i*step));
  }
  if(mode==='dv'){
    ns.sort((a,b)=>a.y-b.y);
    const first=ns[0].y, last=ns[ns.length-1].y, step=(last-first)/(ns.length-1);
    ns.forEach((n,i)=>n.y=snap(first+i*step));
  }
  if(mode==='row'){
    ns.sort((a,b)=>a.x-b.x);
    const y=Math.min(...ys), gap=W+30;
    ns.forEach((n,i)=>{ n.y=y; n.x=snap(ns[0].x+i*gap) });
  }
  touch(); render();
}

function rackElevation(n, height){
  const r=rackOf(n);
  const uh=Math.max(7, Math.min(15, (height-26)/r.ru));
  const W0=210, x0=30, w=W0-x0-8, top=14, H0=top+r.ru*uh+12;
  let out=`<svg viewBox="0 0 ${W0} ${H0}" width="100%" style="display:block;margin-bottom:10px" xmlns="${NS}">
    <text x="${x0}" y="9" font-family="${SANS}" font-size="8" letter-spacing="1.4" fill="#5A6A73">${esc(n.tag)} \u00b7 ${r.ru}U</text>
    <rect x="${x0}" y="${top}" width="${w}" height="${r.ru*uh}" fill="#FBFCFA" stroke="#12222C" stroke-width="1.2"/>`;
  for(let u=1; u<=r.ru; u++){
    const y=top+(r.ru-u)*uh;
    out+=`<line x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}" stroke="#E3E8E4" stroke-width=".5"/>`;
    if(u%5===0||u===1) out+=`<text x="${x0-4}" y="${y+uh-1.5}" text-anchor="end" font-family="${MONO}" font-size="${Math.min(7,uh-1)}" fill="#8A8F8B">${u}</text>`;
  }
  for(const it of r.items){
    const h=Math.max(1,it.h||1), y=top+(r.ru-(it.u+h-1))*uh;
    const c=RACK_FILL[it.kind]||'#5A6A73';
    const ref=it.ref? (S.nodes.find(x=>x.id===it.ref)||{}).tag : '';
    const txt=[ref, it.name].filter(Boolean).join('  ');
    const fs=Math.min(7.5, h*uh-3);
    out+=`<g><rect x="${x0+1.5}" y="${y+1}" width="${w-3}" height="${h*uh-2}" rx="1.5"
        fill="${c}1A" stroke="${c}" stroke-width="1"/>
      <rect x="${x0+1.5}" y="${y+1}" width="3.5" height="${h*uh-2}" fill="${c}"/>
      <text x="${x0+9}" y="${y+h*uh/2+fs*0.36}" font-family="${MONO}" font-size="${fs}" fill="#12222C">${esc(clip(txt,30))}</text>
      ${itemPorts(it)?`<text x="${x0+w-5}" y="${y+h*uh/2+fs*0.36}" text-anchor="end" font-family="${MONO}" font-size="${fs*0.9}" fill="${c}">${itemPorts(it)}p${it.sfp?'+'+it.sfp+'sfp':''}</text>`:''}
    </g>`;
  }
  return out+`</svg>`;
}

let rackCtx={ nodeId:null, itemId:null };

function rackTargets(){ return S.nodes.filter(isRack) }
function currentRack(){
  const list=rackTargets();
  if(!list.length) return null;
  return list.find(n=>n.id===rackCtx.nodeId) || list[0];
}
/* Nearest run of free U to the one asked for. */
function freeAt(r, u, h, skipId){
  const taken=new Set();
  r.items.forEach(i=>{ if(i.id===skipId) return;
    for(let x=i.u; x<i.u+(i.h||1); x++) taken.add(x) });
  const fits=start=>{
    if(start<1 || start+h-1>r.ru) return false;
    for(let x=start; x<start+h; x++) if(taken.has(x)) return false;
    return true;
  };
  if(fits(u)) return u;
  for(let d=1; d<=r.ru; d++){
    if(fits(u-d)) return u-d;
    if(fits(u+d)) return u+d;
  }
  return null;
}

function usedMedia(){ return [...new Set(S.links.map(l=>l.media))] }
function legendHtml(){
  const u=usedMedia(); if(!u.length) return '';
  return `<div class="sec">Cable legend</div>` + u.map(k=>{
    const m=MEDIA[k]||MEDIA.cat6;
    return `<div class="lgd"><i style="border-top-color:${m.color};border-top-style:${m.dash?'dashed':'solid'}"></i>${m.label}</div>`;
  }).join('');
}

/* Flat list of every physical device, counted boxes expanded out. */
function deviceList(){
  syncAutoTags();
  const g=adj();
  return [...S.nodes]
    .sort((a,b)=>(a.tag||'').localeCompare(b.tag||'',undefined,{numeric:true}))
    .flatMap(n=>{
      const to=[...new Set((g.get(n.id)||[])
        .map(id=>{const o=entFast(id); return o?(o.tag||o.label||''):''})
        .filter(Boolean))].join(', ');
      const rows=unitRows(n).map(r=>({...r, kind:'device', name:n.name||'', loc:locOf(n), ip:n.ip||'', to, nodeId:n.id}));
      const acc=accOf(n);
      if(!acc.length) return rows;
      /* One sub line under each listed device, or a single multiplied line when the box is collapsed. */
      const mult = rows.length===1 && qtyOf(n)>1 ? qtyOf(n) : 1;
      return rows.flatMap(r=>[r, ...acc.map(a=>({
        kind:'accessory', parent:r.tag, tag:'\u21b3', label:'', type:a.name||'Accessory',
        qty:accQty(a)*mult, model:a.model||'', loc:'', ip:'', to:'', note:'', nodeId:n.id
      }))]);
    });
}
function locOf(n){
  if(n.room) return n.room;
  const g=groupOf(n);
  return g ? (g.label||'') : '';
}
function inspSched(){
  if(!S.nodes.length) return `<p class="hint">No devices yet. The schedule fills in as you build and prints on page two.</p>`;
  const rows=[...S.nodes].sort((a,b)=>(a.tag||'').localeCompare(b.tag||'',undefined,{numeric:true})).map(n=>{
    const d=DEVBY[n.type];
    const to=[...new Set((adj().get(n.id)||[])
      .map(id=>{const o=entFast(id); return o?(o.tag||o.label||''):''}).filter(Boolean))].join(', ');
    return `<tr data-node="${n.id}"><td>${esc(tagLabel(n))}</td><td>${esc(d.n)}</td><td style="text-align:center">${qtyOf(n)}</td><td>${esc(locOf(n))}</td></tr>`;
  }).join('');
  const counts={}; let total=0;
  S.nodes.forEach(n=>{const d=DEVBY[n.type]; counts[d.n]=(counts[d.n]||0)+qtyOf(n); total+=qtyOf(n)});
  const flat=deviceList().map(r=> r.kind==='accessory'
    ? `<tr data-node="${r.nodeId}" class="accrow"><td>\u21b3</td><td>${esc(clip(r.type,14))}${r.qty>1?' \u00d7'+r.qty:''}</td><td>${esc(clip(r.model||'\u2014',18))}</td></tr>`
    : `<tr data-node="${r.nodeId}"><td>${esc(r.tag)}</td><td>${esc(r.label||'\u2014')}</td><td>${esc(clip(r.model||'\u2014',18))}</td></tr>`).join('');
  return `<div class="sec">Device count</div>
    <table class="tbl"><tbody>${Object.entries(counts).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right">${v}</td></tr>`).join('')}
    <tr><td style="font-weight:700">Total</td><td style="text-align:right;font-weight:700">${total}</td></tr></tbody></table>
    <div class="sec">Summary by box</div>
    <table class="tbl"><thead><tr><th>Tag</th><th>Type</th><th>Qty</th><th>Location</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sec">Install list, one line per device</div>
    <table class="tbl"><thead><tr><th>Tag</th><th>Label</th><th>Model</th></tr></thead><tbody>${flat}</tbody></table>
    <button class="mini" id="csv" style="margin-top:10px">Also export CSV</button>`;
}

function wireInspector(){
  const body=document.getElementById('tabbody');
  body.querySelectorAll('[data-n]').forEach(inp=>{
    inp.oninput=()=>{
      const n=S.nodes.find(x=>x.id===sel.id); if(!n) return;
      const f=inp.dataset.n;
      if(f==='expand'){
        n.expand = inp.value==='1';
        touch(); renderInspector(); return;
      }
      if(f==='qty'){
        n.qty=Math.min(999, Math.max(1, parseInt(inp.value||1,10)||1));
        touch(); renderNodes(); renderInspector(); return;
      }
      if(f==='tag'){
        n.tag=inp.value; n.tagLock=true; touch(); renderNodes(); renderStamp(); return;
      }
      if(f==='type'){
        n.type=inp.value;
        const d=DEVBY[inp.value];
        if(!n.name || DEV.some(x=>x.n===n.name)) n.name=d.n;
        n.tag=nextTag(d);
      } else n[f]=inp.value;
      touch(); renderNodes(); renderStamp();
      if(f==='type'){ renderInspector(); renderLinks() }
    };
  });
  body.querySelectorAll('[data-l]').forEach(inp=>{
    const set=()=>{
      const l=S.links.find(x=>x.id===sel.id); if(!l) return;
      const f=inp.dataset.l;
      if(f==='qty'){ l.qty=Math.max(1,parseInt(inp.value||1,10)); l.qtyLock=true }
      else l[f]=inp.value;
      if(f==='route'||f==='fromSide'||f==='toSide') l.bend=0;
      if(f==='fromSide') l.fromOff=0;
      if(f==='toSide')   l.toOff=0;
      touch(); renderLinks();
    };
    inp.oninput=set; inp.onchange=set;
  });
  body.querySelectorAll('[data-m]').forEach(inp=>{
    inp.oninput=()=>{ S.meta[inp.dataset.m]=inp.value; touch(); renderStamp();
      if(inp.dataset.m==='project') document.getElementById('projName').value=inp.value; };
  });
  body.querySelectorAll('[data-s]').forEach(inp=>{
    inp.onchange=()=>{
      const f=inp.dataset.s;
      S.settings[f] = (f==='snap'||f==='cableSheet'||f==='rackPages'||f==='patchPages') ? inp.value==='1'
                    : f==='pad' ? parseInt(inp.value,10) : inp.value;

  const gr=body.querySelector('#gorack'); if(gr) gr.onclick=()=>{ rackCtx.nodeId=sel.id; showTab('rack') };
  const rkPick=body.querySelector('#rkPick'); if(rkPick) rkPick.onchange=()=>{
    rackCtx.nodeId=rkPick.value; rackCtx.itemId=null; renderInspector();
  };
  body.querySelectorAll('[data-rkadd]').forEach(b=>{
    b.onclick=()=>{
      const n=currentRack(); if(!n) return;
      const it=addRackItem(n, b.dataset.rkadd);

    b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain','rkpart:'+b.dataset.rkadd));

  body.querySelectorAll('[data-rkit]').forEach(el=>{
    if(el.tagName==='TR'){ el.onclick=()=>{ rackCtx.itemId=el.dataset.rkit; renderInspector() }; return }

  });
  const frame=body.querySelector('#rkFrame');
  if(frame){
    frame.addEventListener('dragover', e=>e.preventDefault());
    frame.addEventListener('drop', e=>{
      e.preventDefault();
      const data=e.dataTransfer.getData('text/plain')||'';
      if(!data.startsWith('rkpart:')) return;
      const n=currentRack(); if(!n) return;
      const r=rackOf(n), uh=parseFloat(frame.dataset.uh);

  body.querySelectorAll('[data-ri]').forEach(inp=>{

  body.querySelectorAll('[data-rdel]').forEach(b=>{

  body.querySelectorAll('[data-adel]').forEach(b=>{

  const addacc=body.querySelector('#addacc'); if(addacc) addacc.onclick=()=>{
    const n=S.nodes.find(x=>x.id===sel.id); if(!n) return;

  };
  body.querySelectorAll('[data-g]').forEach(inp=>{
    inp.oninput=inp.onchange=()=>{
      const g=S.groups.find(x=>x.id===sel.id); if(!g) return;
      g[inp.dataset.g]=inp.value; touch(); renderGroups();
    };
  });
  body.querySelectorAll('[data-b]').forEach(inp=>{
    inp.oninput=()=>{ brand[inp.dataset.b]=inp.value; saveBrand(); };
  });
  const lp=body.querySelector('#logoPick');  if(lp) lp.onclick=()=>pickImage('logo');
  const lc=body.querySelector('#logoClear'); if(lc) lc.onclick=()=>{ brand.logo=''; saveBrand(); renderInspector() };
  body.querySelectorAll('[data-ph]').forEach(cb=>{
    cb.onchange=()=>{ const o=photoItemById(cb.dataset.ph); if(o){ o.photoOn=cb.checked; touch() } };
  });
  const phAll=body.querySelector('#phAll');   if(phAll) phAll.onclick=()=>{
    photoItems().forEach(x=>{ const o=photoItemById(x.id); if(o) o.photoOn=true });

  const phNone=body.querySelector('#phNone'); if(phNone) phNone.onclick=()=>{

  const cp=body.querySelector('#coverPick'); if(cp) cp.onclick=()=>pickImage('coverImg');
  const mp=body.querySelector('#mapPick');   if(mp) mp.onclick=()=>pickImage('mapImg');
  const cc=body.querySelector('#coverClear');if(cc) cc.onclick=()=>{ S.meta.coverImg=''; touch(); renderInspector() };
  const mc=body.querySelector('#mapClear');  if(mc) mc.onclick=()=>{ S.meta.mapImg=''; touch(); renderInspector() };

    S.nodes.filter(n=>multi.includes(n.id)).forEach(n=>{
      const d=DEVBY[n.type];
      const c={...n, id:uid(), tag: numMode(n.type)==='restart'? n.tag : nextTagAfter(d, copies),
               x:n.x+24, y:n.y+24, acc:(n.acc||[]).map(a=>({...a})), units:(n.units||[]).map(u=>({...u}))};
      map[n.id]=c.id; copies.push(c);
    });
    S.nodes.push(...copies);
    S.links.filter(l=>map[l.from]&&map[l.to]).forEach(l=>{
      S.links.push({...l, id:uid(), from:map[l.from], to:map[l.to]});
    });
    multi=copies.map(c=>c.id); sel={kind:'node',id:multi[0]};
