      } else {
        const d=DEVBY[sl.dataset.num]; let i=1;
        S.nodes.filter(n=>n.type===sl.dataset.num)
          .sort((a,b)=>(a.y-b.y)||(a.x-b.x))
          .forEach(n=>{ n.tag=tagFor(d,i); n.tagLock=false; i+=qtyOf(n) });
      }
      touch(); render(); renderInspector();
    };
  });
  const sr=body.querySelector('#saverev'); if(sr) sr.onclick=saveRevision;
  body.querySelectorAll('[data-revopen]').forEach(b=>{ b.onclick=()=>openRevision(Number(b.dataset.revopen)) });
  body.querySelectorAll('[data-revdel]').forEach(b=>{ b.onclick=()=>deleteRevision(Number(b.dataset.revdel)) });
  const tidy=body.querySelector('#tidy'); if(tidy) tidy.onclick=()=>{
    pushUndo();
    S.links.forEach(l=>{ l.bend=0; l.route=''; l.fromSide=''; l.toSide=''; l.fromOff=0; l.toOff=0 });
    touch(); render(); toast('Connections reset to the default path.');
  };
  const retag=body.querySelector('#retag'); if(retag) retag.onclick=()=>{
    pushUndo();
    const c={};
    [...S.nodes].sort((a,b)=> (a.y-b.y) || (a.x-b.x)).forEach(n=>{
      n.tagLock=false;
      if(numMode(n.type)==='restart') return;      // handled by the drawing
      const d=DEVBY[n.type];
      const start=(c[d.k]||0)+1;
      n.tag=tagFor(d, start);
      c[d.k]=start+qtyOf(n)-1;
    });
    syncAutoTags();
    touch(); render(); toast('Renumbered top to bottom, left to right.');
  };
  body.querySelectorAll('[data-goto]').forEach(tr=>{
    tr.onclick=()=>{ sel={kind:'link',id:tr.dataset.goto}; render() };
  });
  body.querySelectorAll('tr[data-node]').forEach(tr=>{
    tr.onclick=()=>{ sel={kind:'node',id:tr.dataset.node}; showTab('device'); render() };
  });
}

/* Drag an item up and down its rack. */
function startRackDrag(e, el){
  const n=currentRack(); if(!n) return;
  const r=rackOf(n);
  const it=r.items.find(x=>x.id===el.dataset.rkit); if(!it) return;
  rackCtx.itemId=it.id;
  const frame=document.getElementById('rkFrame');
  const uh=parseFloat(frame.dataset.uh);
  const startY=e.clientY, startU=it.u;
  el.classList.add('drag');
  el.setPointerCapture && el.setPointerCapture(e.pointerId);
  document.querySelectorAll('.rk-item').forEach(x=>x.classList.toggle('sel', x===el));

  const move=ev=>{
    const shift=Math.round((startY-ev.clientY)/uh);
    let want=Math.max(1, Math.min(r.ru-(it.h||1)+1, startU+shift));
    const spot=freeAt(r, want, it.h||1, it.id);
    if(spot!==null && spot!==it.u){
      it.u=spot;
      el.style.bottom=((it.u-1)*uh)+'px';
    }
  };
  const up=()=>{
    el.classList.remove('drag');
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    touch(); renderInspector();
  };
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  e.preventDefault();
}

/* =========================================================
   Patching, port to port.

   A port assignment says what lands on a port.  A patch says where the other
   end of that jumper goes, so a tech in front of the rack is told both ends:
   switch SFP1 into fiber enclosure 01, not just "fiber".  The patch is stored
   once, on the side it was entered from, and read from either end.
   ========================================================= */
function portName(it, p){
  const total=itemPorts(it);
  return p<total ? String(p+1).padStart(2,'0') : 'SFP'+(p-total+1);
}
function portCount(it){ return itemPorts(it)+(it.sfp||0) }
function itemName(n, it){
  const ref = it.ref ? (S.nodes.find(x=>x.id===it.ref)||{}).tag : '';
  return [ref, it.name].filter(Boolean).join(' · ') || 'Item';
}
function itemFullName(n, it){ return n.tag+' · '+itemName(n,it) }

/* Every rack item with ports, for the target picker. */
function patchTargets(){
  const out=[];
  for(const n of S.nodes){
    if(!isRack(n) || !n.rack) continue;
    for(const it of n.rack.items) if(portCount(it)) out.push({node:n, item:it});
  }
  return out;
}
function findRackItem(nodeId, itemId){
  const n=S.nodes.find(x=>x.id===nodeId);
  if(!n || !n.rack) return null;
  const it=n.rack.items.find(x=>x.id===itemId);
  return it ? {node:n, item:it} : null;
}

/* Read every patch in the job once, then look ends up against it. */
function patchList(){
  const out=[];
  for(const n of S.nodes){
    if(!isRack(n) || !n.rack) continue;
    for(const it of n.rack.items){
      (it.assign||[]).forEach((a,p)=>{
        if(!a || !a.to || !a.to.i) return;
        const far=findRackItem(a.to.n, a.to.i);
        if(!far || a.to.p==null) return;
        out.push({ a:{node:n,item:it,port:p}, b:{node:far.node,item:far.item,port:a.to.p},
                   device:a.tag||'', note:a.label||'' });
      });
    }
  }
  return out;
}
/* What is on the far end of this port, whichever side the patch was typed on. */
function patchEnd(list, itemId, port){
  for(const pc of list){
    if(pc.a.item.id===itemId && pc.a.port===port) return {end:pc.b, own:true,  pc};
    if(pc.b.item.id===itemId && pc.b.port===port) return {end:pc.a, own:false, pc};
  }
  return null;
}
/* Ports on the far side that two jumpers both claim. */
function patchClashes(list){
  const seen=new Map(), bad=new Set();
  for(const pc of list){
    for(const e of [pc.a, pc.b]){
      const k=e.item.id+'#'+e.port;
      if(seen.has(k)) { bad.add(k); bad.add(seen.get(k)) } else seen.set(k,k);
    }
  }
  return bad;
}
function setPatch(it, port, nodeId, itemId, farPort){
  it.assign=it.assign||[];
  const cur=Object.assign({tag:'',label:''}, it.assign[port]);
  if(!itemId || farPort==null || farPort<0) delete cur.to;
  else cur.to={n:nodeId, i:itemId, p:farPort};
  it.assign[port]=cur;
}
/* Clear a patch from whichever side holds it. */
function clearPatch(list, itemId, port){
  const hit=patchEnd(list, itemId, port);
  if(!hit) return;
  const own=hit.pc.a;
  const a=(own.item.assign||[])[own.port];
  if(a) delete a.to;
}

/* ---- port assignment ---- */
const povl=document.getElementById('povl');
let portCtx=null;

function portSources(rackNode, item){
  const anchor = item.ref ? S.nodes.find(x=>x.id===item.ref) : rackNode;
  if(!anchor) return [];
  const seen=new Set(), out=[];
  for(const l of S.links){
    if(l.from!==anchor.id && l.to!==anchor.id) continue;
    const o=ent(l.from===anchor.id? l.to : l.from);
    if(!o || o.w || seen.has(o.id)) continue;
    const d=DEVBY[o.type]; if(!d) continue;
    const wantInfra = item.kind==='fiber';
    if(d.f==='infra' && !wantInfra) continue;
    seen.add(o.id);
    for(let i=0;i<qtyOf(o);i++){
      const t=unitTagAt(o,i);
      const u=(o.units||[])[i];
      out.push({ tag:t, label:(u&&u.label)||autoLabel(o,t) });
    }
  }
  return out.sort((a,b)=>a.tag.localeCompare(b.tag,undefined,{numeric:true}));
}
function portDrift(n, it){
  const src=portSources(n,it);
  const srcTags=new Set(src.map(x=>x.tag));
  const assigned=(it.assign||[]).filter(a=>a&&a.tag);
  const aTags=new Set(assigned.map(a=>a.tag));
  return {
    added:   src.filter(x=>!aTags.has(x.tag)).length,
    orphan:  assigned.filter(a=>!srcTags.has(a.tag)).length,
    over:    src.length>itemPorts(it)+ (it.sfp||0),
    src
  };
}
function refreshPorts(n, it){
  const {src}=portDrift(n,it);
  const total=itemPorts(it)+(it.sfp||0);
  const keep=(it.assign||[]).map(a=>a&&a.tag? a : null);
  const have=new Set(keep.filter(Boolean).map(a=>a.tag));
  const queue=src.filter(x=>!have.has(x.tag));
  const out=[];
  for(let i=0;i<total;i++){
    if(keep[i] && keep[i].tag) out[i]=keep[i];
    else if(queue.length) out[i]={tag:queue[0].tag, label:queue.shift().label};
  }
  it.assign=out;
  return src.length;
}

function openPorts(nodeId, itemId){
  const n=S.nodes.find(x=>x.id===nodeId); if(!n) return;
  const it=rackOf(n).items.find(x=>x.id===itemId); if(!it) return;
  portCtx={nodeId, itemId};
  povl.classList.add('on');
  renderPorts();
}
function closePorts(){ povl.classList.remove('on'); portCtx=null; renderInspector() }
function renderPorts(){
  if(!portCtx) return;
  const n=S.nodes.find(x=>x.id===portCtx.nodeId);
  const it=rackOf(n).items.find(x=>x.id===portCtx.itemId);
  const total=itemPorts(it), all=portCount(it);
  it.assign=it.assign||[];
  document.getElementById('ptitle').textContent=`${n.tag} · ${it.name||'Item'} · ${total} ports`;

  const list=patchList(), clash=patchClashes(list);
  const filled=it.assign.filter(a=>a&&a.tag).length;
  const patched=[];
  for(let i=0;i<all;i++) if(patchEnd(list,it.id,i)) patched.push(i);
  const dr=portDrift(n,it);
  const warn=[];
  if(dr.added)  warn.push(dr.added+' device'+(dr.added>1?'s':'')+' on the drawing not assigned yet');
  if(dr.orphan) warn.push(dr.orphan+' assignment'+(dr.orphan>1?'s':'')+' no longer match a device');
  if(dr.over)   warn.push('more devices than this has ports');
  const mine=[...clash].filter(k=>k.startsWith(it.id+'#')).length;
  if(mine) warn.push(mine+' port'+(mine>1?'s':'')+' patched twice');
  document.getElementById('pnote').innerHTML=
    `${filled} of ${total} assigned, ${patched.length} of ${all} patched. Blank ports print as empty rows for the tech to write in.` +
    (warn.length? `<b class="pwarn">${esc(warn.join(' · '))}</b>` : '');

  document.getElementById('phdr').innerHTML=
    '<div><span class="h1">#</span><span class="h2">Device</span><span class="h3">Label</span><span class="h4">Patches into</span></div>';

  /* Somewhere to send a jumper: any other item in any rack that has ports. */
  const targets=patchTargets().filter(t=>t.item.id!==it.id);
  const targetOpts=(sel)=>['<option value="">—</option>'].concat(
    targets.map(t=>`<option value="${t.node.id}|${t.item.id}" ${sel===t.node.id+'|'+t.item.id?'selected':''}>${esc(itemFullName(t.node,t.item))}</option>`)
  ).join('');

  let html='<div class="pgridwrap">';
  for(let i=0;i<all;i++){
    const a=it.assign[i]||{};
    const hit=patchEnd(list, it.id, i);
    const isSfp=i>=total;
    const key=it.id+'#'+i;
    let tail;
    if(hit && !hit.own){
      /* the other item holds this one, so show it rather than offer a second copy */
      tail=`<div class="mirror" title="Set from the other end">← <b>${esc(itemFullName(hit.end.node,hit.end.item))}</b> ${esc(portName(hit.end.item,hit.end.port))}
        <button data-punlink="${i}" title="Remove this patch">clear</button></div>`;
    }else{
      const cur=hit ? hit.end.node.id+'|'+hit.end.item.id : '';
      const far=hit ? hit.end.item : null;
      const pOpts=far
        ? ['<option value="">—</option>'].concat(
            Array.from({length:portCount(far)},(_,k)=>`<option value="${k}" ${hit.end.port===k?'selected':''}>${portName(far,k)}</option>`)
          ).join('')
        : '<option value="">—</option>';
      tail=`<span class="parrow">→</span>
        <select class="toitem" data-p="${i}" data-pt="item">${targetOpts(cur)}</select>
        <select class="toport" data-p="${i}" data-pt="port" ${far?'':'disabled'}>${pOpts}</select>`;
    }
    html+=`<div class="prow2 ${isSfp?'sfp':''} ${clash.has(key)?'clash':''}"><span>${portName(it,i)}</span>
      <input data-p="${i}" data-pf="tag" value="${esc(a.tag||'')}" placeholder="—">
      <input data-p="${i}" data-pf="label" value="${esc(a.label||'')}" placeholder="${isSfp?'uplink':'label'}">
      ${tail}</div>`;
  }
  document.getElementById('pgrid').innerHTML=html+'</div>';

  const grid=document.getElementById('pgrid');
  grid.querySelectorAll('[data-pf]').forEach(inp=>{
    inp.oninput=()=>{
      const i=parseInt(inp.dataset.p,10);
      it.assign[i]=Object.assign({tag:'',label:''}, it.assign[i], {[inp.dataset.pf]:inp.value});
      touch();
    };
  });
  grid.querySelectorAll('[data-pt="item"]').forEach(sel=>{
    sel.onchange=()=>{
      const i=parseInt(sel.dataset.p,10);
      if(!sel.value){ clearPatch(patchList(), it.id, i); touch(); renderPorts(); return }
      const [nid,iid]=sel.value.split('|');
      const far=findRackItem(nid,iid); if(!far) return;
      const held=patchEnd(patchList(), it.id, i);
      const keep = held && held.own && held.end.item.id===iid ? held.end.port : firstFreePort(far.item, patchList());
      setPatch(it, i, nid, iid, keep==null?0:keep);
      touch(); renderPorts();
    };
  });
  grid.querySelectorAll('[data-pt="port"]').forEach(sel=>{
    sel.onchange=()=>{
      const i=parseInt(sel.dataset.p,10);
      const cur=(it.assign[i]||{}).to; if(!cur) return;
      setPatch(it, i, cur.n, cur.i, sel.value===''? null : parseInt(sel.value,10));
      touch(); renderPorts();
    };
  });
  grid.querySelectorAll('[data-punlink]').forEach(b=>{
    b.onclick=()=>{ clearPatch(patchList(), it.id, parseInt(b.dataset.punlink,10)); touch(); renderPorts() };
  });

  /* straight through picker */
  const st=document.getElementById('pstraight');
  st.innerHTML='<option value="">Patch straight through to…</option>'+
    targets.map(t=>`<option value="${t.node.id}|${t.item.id}">${esc(itemFullName(t.node,t.item))}</option>`).join('');
  st.onchange=()=>{
    if(!st.value) return;
    const [nid,iid]=st.value.split('|');
    const far=findRackItem(nid,iid);
    st.value='';
    if(!far) return;
    const count=Math.min(all, portCount(far.item));
    for(let i=0;i<count;i++) setPatch(it, i, nid, iid, i);
    touch(); renderPorts();
    toast(count+' ports patched one to one into '+itemFullName(far.node,far.item)+'.');
  };
}

/* Lowest port on the far item that nothing is patched into yet. */
function firstFreePort(it, list){
  for(let k=0;k<portCount(it);k++) if(!patchEnd(list, it.id, k)) return k;
  return 0;
}

/* =========================================================
   Storage
   ========================================================= */
const mem={};
/* Three homes for data, in order: the Claude host, IndexedDB in a normal browser,
   memory as a last resort. IndexedDB is what makes this work as a standalone app. */
const idb=(()=>{
  let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{
      if(!window.indexedDB) return rej(new Error('no idb'));
      const rq=indexedDB.open('riser-builder',1);
      rq.onupgradeneeded=()=>{ rq.result.createObjectStore('kv') };
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
    return dbp;
  }
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('kv',mode), st=tx.objectStore('kv');
    const rq=fn(st);
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  }));
  return {
    get:k=>run('readonly',st=>st.get(k)),
    set:(k,v)=>run('readwrite',st=>st.put(v,k)),
    del:k=>run('readwrite',st=>st.delete(k))
  };
})();

const store={
  async get(k){
    if(window.storage) return await window.storage.get(k,false);
    try{
      const v=await idb.get(k);
      if(v!==undefined) return {key:k,value:v};
      throw new Error('missing');
    }catch(e){
      if(e && e.message==='missing') throw e;
      const v=mem[k]; if(v===undefined) throw new Error('missing');
      return {key:k,value:v};
    }
  },
  async set(k,v){
    if(window.storage) return await window.storage.set(k,v,false);
    mem[k]=v;
    try{ await idb.set(k,v) }catch{}
    return {key:k,value:v};
  },
  async del(k){
    if(window.storage) return await window.storage.delete(k,false);
    delete mem[k];
    try{ await idb.del(k) }catch{}
    return {key:k,deleted:true};
  }
};

/* =========================================================
   Keeping a copy on the machine itself.

   Projects live in browser storage, which is fine until someone clears
   browsing data.  Point the app at a real folder once and every save drops a
   plain .json next to it, so the working copy and the record copy stay in step
   without anyone having to remember to export.
   ========================================================= */
const BKKEY='topo:backupdir';
const APPDIR='Riser Builder';
const SAVEDIR='Saves';
let bkDir=null;          /* the folder the user picked */
let bkApp=null, bkSaves=null;   /* Riser Builder, and Saves inside it */
let bkState='off';       /* off | ready | needs-permission | unsupported */
let bkLast=0, persisted=null;

/* The picked folder is somewhere to put our own folder, not somewhere to
   scatter files.  Everything lands in <picked>/Riser Builder/Saves, made on
   demand.  Picking the app folder itself is treated as picking its parent, so
   choosing it twice does not nest. */
async function bkDirs(){
  if(bkSaves) return bkSaves;
  if(!bkDir) throw new Error('no folder');
  bkApp = bkDir.name===APPDIR ? bkDir : await bkDir.getDirectoryHandle(APPDIR,{create:true});
  bkSaves = await bkApp.getDirectoryHandle(SAVEDIR,{create:true});
  return bkSaves;
}
function bkClearDirs(){ bkApp=null; bkSaves=null }
function bkPath(){
  if(!bkDir) return '';
  return bkDir.name===APPDIR ? bkDir.name+'/'+SAVEDIR
                             : bkDir.name+'/'+APPDIR+'/'+SAVEDIR;
}

/* A note for whoever finds the folder later, including you in two years. */
const BKREADME = [
  'Riser Builder',
  '',
  'Saves holds one .json per project, rewritten every time that project is',
  'saved in the app. They are the record copy of your drawings.',
  '',
  'To get a drawing back: open Riser Builder, click Import, and pick the file.',
  'That works on any machine, and does not need this folder to be linked.',
  '',
  'These files are plain text. Copying them onto a backup drive or into a job',
  'folder is enough, there is nothing else to keep.'
].join('\n')+'\n';

async function bkReadme(){
  try{
    await bkDirs();
    const fh=await bkApp.getFileHandle('read me.txt',{create:true});
    const w=await fh.createWritable();
    await w.write(BKREADME); await w.close();
  }catch{}
}

const fsOK = () => typeof window.showDirectoryPicker==='function';

/* Ask the browser not to evict us.  Silent either way, it only ever helps. */
async function askPersist(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    persisted = await navigator.storage.persisted();
    if(!persisted) persisted = await navigator.storage.persist();
  }catch{ persisted=null }
  renderBackupBar();
}

/* Folder handles are structured clone only, so they go straight into idb
   rather than through the json store. */
async function bkLoad(){
  if(!fsOK()){ bkState='unsupported'; renderBackupBar(); return }
  try{
    const h=await idb.get(BKKEY);
    if(!h){ bkState='off'; renderBackupBar(); return }
    bkDir=h; bkClearDirs();
    const perm=await h.queryPermission({mode:'readwrite'});
    bkState = perm==='granted' ? 'ready' : 'needs-permission';
  }catch{ bkDir=null; bkState='off' }
  renderBackupBar();
  if(bkState==='ready') bkWrite(true);
}

async function bkPick(){
  if(!fsOK()){ toast('This browser cannot write to a folder. Use Export file instead.'); return }
  try{
    const h=await window.showDirectoryPicker({id:'topo-backup', mode:'readwrite', startIn:'documents'});
    if((await h.requestPermission({mode:'readwrite'}))!=='granted'){ toast('That folder was not allowed.'); return }
    bkDir=h; bkClearDirs(); bkState='ready';
    try{ await idb.set(BKKEY,h) }catch{}
    renderBackupBar();
    await bkReadme();
    await bkAll();
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast('Could not use that folder.');
  }
}

async function bkReconnect(){
  if(!bkDir) return;
  try{
    const perm=await bkDir.requestPermission({mode:'readwrite'});
    bkState = perm==='granted' ? 'ready' : 'needs-permission';
    bkClearDirs();
    renderBackupBar();
    if(bkState==='ready'){ await bkReadme(); await bkWrite(false) }
    else toast('Still waiting on permission for that folder.');
  }catch{ toast('Could not reconnect that folder.') }
}

async function bkForget(){
  bkDir=null; bkClearDirs(); bkState='off'; bkLast=0;
  try{ await idb.del(BKKEY) }catch{}
  renderBackupBar();
  toast('Backup folder unlinked. Saves stay in this browser only.');
}

const bkName = st => slug(st.meta && st.meta.project) + '.topology.json';

async function bkWriteState(st){
  const dir=await bkDirs();
  const fh=await dir.getFileHandle(bkName(st), {create:true});
  const w=await fh.createWritable();
  await w.write(JSON.stringify(st,null,2));
  await w.close();
}

/* The open project, on every save. */
async function bkWrite(quiet){
  if(bkState!=='ready' || !bkDir) return false;
  try{
    S.view=view;
    await bkWriteState(S);
    bkLast=Date.now(); renderBackupBar();
    if(!quiet) toast('Copy written to '+bkPath()+'.');
    return true;
  }catch(e){
    if(e && (e.name==='NotAllowedError' || e.name==='SecurityError')){ bkState='needs-permission'; bkClearDirs() }
    renderBackupBar();
    if(!quiet) toast('Could not write the backup copy.');
    return false;
  }
}

/* Everything in the library, for when the folder is first linked. */
async function bkAll(){
  if(bkState!=='ready' || !bkDir) return 0;
  let n=0, bad=0;
  try{ S.view=view; await bkWriteState(S); n++ }catch{ bad++ }
  const idx=await readIndex();
  for(const r of idx){
    if(r.id===S.id) continue;
    try{
      const st=JSON.parse((await store.get('topo:proj:'+r.id)).value);
      await bkWriteState(st); n++;
    }catch{ bad++ }
  }
  bkLast=Date.now(); renderBackupBar();
  toast(n+' project'+(n===1?'':'s')+' written to '+bkPath()+(bad?', '+bad+' could not be read':'')+'.');
  return n;
}

function renderBackupBar(){
  const el=document.getElementById('bkbar'); if(!el) return;
  const room = persisted===true
    ? 'The browser has marked this storage permanent.'
    : persisted===false
      ? 'The browser keeps this storage on a best effort basis and may clear it if the disk runs tight.'
      : '';
  let line='', btns='';
  if(bkState==='unsupported'){
    line='<b>No automatic copy on this computer.</b> This browser cannot write to a folder on its own, so use <b>Export file</b> when you finish a drawing. Chrome and Edge can do it automatically.';
  }else if(bkState==='off'){
    line='<b>Your projects live in this browser only.</b> Clearing browsing data would take them with it. Pick somewhere to keep them and the app makes itself a <b>'
      + APPDIR + '</b> folder there, with a <b>' + SAVEDIR + '</b> folder inside that gets a plain .json copy of every project as you save it.';
    btns='<button class="mini" id="bkpick">Choose where to keep them</button>';
  }else if(bkState==='needs-permission'){
    line='<b>Backup folder needs permission again.</b> Browsers drop folder access between sessions, so nothing has been written to '
      + esc(bkPath()||'the folder') + ' yet this time.';
    btns='<button class="mini" id="bkfix">Reconnect folder</button><button class="mini" id="bkoff">Unlink</button>';
  }else{
    line='Every save also writes a copy into <b>'+esc(bkPath())+'</b>'
      + (bkLast? ', last written '+ago(bkLast) : '') + '.';
    btns='<button class="mini" id="bknow">Back up all projects now</button>'
      + '<button class="mini" id="bkpick">Move it</button>'
      + '<button class="mini" id="bkoff">Unlink</button>';
  }
  showSaveState();
  el.className='bkbar '+(bkState==='ready'?'ok':'warn');
  el.innerHTML='<div>'+line+(room?' '+room:'')+'</div><div class="btns">'+btns+'</div>';
  const on=(id,fn)=>{ const b=el.querySelector('#'+id); if(b) b.onclick=fn };
  on('bkpick', bkPick);
  on('bkfix',  bkReconnect);
  on('bkoff',  bkForget);
  on('bknow',  bkAll);
}

function ago(t){
  if(!t) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+' min ago';
  const h=Math.round(m/60); if(h<24) return h+(h===1?' hour ago':' hours ago');
  const d=Math.round(h/24); if(d<30) return d+(d===1?' day ago':' days ago');
  return new Date(t).toLocaleDateString();
}

      await store.set('topo:proj:'+obj.id, JSON.stringify(obj));
      libIndex.unshift({...rec, id:obj.id, name:obj.meta.project, updated:Date.now()});
      await store.set(IDX, JSON.stringify(libIndex));
      renderLibrary(); toast('Copied');
    }catch{ toast('Copy failed.') }

});

/* Photos get resized before they go anywhere near storage. */
function readImage(file, maxW){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('decode'));
      img.onload=()=>{
        const scale=Math.min(1, maxW/img.width);
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        try{ res(cv.toDataURL('image/jpeg',0.82)) }catch(e){ rej(e) }
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---- semver compare, plain numeric, no prerelease games ---- */
function newer(a,b){
  const pa=String(a).split('.').map(n=>parseInt(n,10)||0);
  const pb=String(b).split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<3;i++){ if((pa[i]||0)>(pb[i]||0)) return true; if((pa[i]||0)<(pb[i]||0)) return false; }
  return false;
}

let latest=null;              /* {version, date, notes[], file} */
let deferredInstall=null;

function setState(kind,msg,sub){
  const dot=document.getElementById('udot');
  dot.className='udot'+(kind?' '+kind:'');
  document.getElementById('utxt').innerHTML =
    msg + (sub? '<small>'+sub+'</small>' : '');
}

function renderLog(){
  const merged=CHANGELOG.slice();
  if(latest && newer(latest.version,APP_VERSION) && !merged.some(c=>c.v===latest.version))
    merged.unshift({v:latest.version, d:latest.date||'', notes:latest.notes||[]});
  document.getElementById('ulog').innerHTML = merged.map(c=>{
    const tag = c.v===APP_VERSION ? '<span class="tagnow">You have this</span>'
              : newer(c.v,APP_VERSION) ? '<span class="tagnew">New</span>' : '';
    return '<li><div class="cver"><b>v'+c.v+'</b>'
      + (c.d?'<time>'+c.d+'</time>':'') + tag + '</div>'
      + '<ul>'+(c.notes||[]).map(n=>'<li>'+n+'</li>').join('')+'</ul></li>';
  }).join('');
}

function setHelp(html){ document.getElementById('uhelp').innerHTML = html||''; }

/* ---- check ---- */
async function checkUpdate(loud){
  const url = (served ? 'version.json' : HOME+'version.json') + '?t=' + Date.now();
  if(loud){ setState('busy','Checking for updates'); verBtn.classList.add('checking'); }
  document.getElementById('ugo').style.display='none';
  try{
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    latest = await r.json();
    verBtn.classList.remove('checking');
    if(newer(latest.version, APP_VERSION)){
      verBtn.classList.add('new');
      setState('new','Version '+latest.version+' is available',
        'You are on '+APP_VERSION+'. Your saved projects are not touched by an update.');
      const go=document.getElementById('ugo');
      go.style.display=''; go.disabled=false;
      go.textContent = served ? 'Update now' : 'Download update';
      if(!served) setHelp(
        '<b>Heads up.</b> You opened this from a file on your computer, so it cannot replace itself. '
        + 'Download will save the new version to your Downloads folder, then you drop it over the old file. '
        + 'To get true one click updates, open the app from <code>'+HOME+'</code> and install it from there.');
      else setHelp('');
      if(!loud) toast('Update available: v'+latest.version);
    }else{
      verBtn.classList.remove('new');
      setState('ok','You are up to date','Version '+APP_VERSION+' is the latest build.');
      setHelp('');
    }
  }catch(err){
    verBtn.classList.remove('checking');
    latest=null;
    if(loud) setState('warn','Could not reach the update server',
      'No internet, or the release page is not published yet. The app works fine offline, this check just needs a connection.');
    if(loud) setHelp(
      '<b>If this keeps failing.</b> Confirm GitHub Pages is turned on for the repo and that '
      + '<code>'+HOME+'version.json</code> opens in a browser.');
  }
  renderLog();
}

/* ---- apply ---- */
async function applyUpdate(){
  const go=document.getElementById('ugo');
  if(!latest) return;

  /* Local file: cannot self replace, so hand over the new build. */
  if(!served){
    const file = latest.file || 'topology-builder.html';
    setState('busy','Downloading v'+latest.version);
    try{
      const r = await fetch(HOME+file+'?t='+Date.now(), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const blob = await r.blob();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='topology-builder.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      setState('ok','Downloaded v'+latest.version,
        'Close the app, drop the new file over your old topology-builder.html, then reopen it.');
    }catch(e){
      setState('warn','Download failed','Open '+HOME+' in a browser and save the page instead.');
    }
    return;
  }

  /* Served: clear the offline cache, drop the old worker, reload clean. */
  go.disabled=true;
  setState('busy','Installing v'+latest.version,'This takes a few seconds.');
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  const u = new URL(location.href);
  u.searchParams.set('u', latest.version);
  location.replace(u.toString());
}

/* strip the cache busting param after an update reload */
if(served && new URL(location.href).searchParams.has('u')){
  const u=new URL(location.href); u.searchParams.delete('u');
  history.replaceState({}, '', u.pathname + (u.search||'') + u.hash);
  setTimeout(()=>toast('Updated to v'+APP_VERSION),400);
}
